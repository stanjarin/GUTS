name: Branch-only Runyon Joyce rebuild
on:
  push:
    branches: [contents-repair]
    paths: ['.github/workflows/boundary_forensic.yml']
permissions:
  contents: write
jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: contents-repair}
      - name: Rebuild Runyon and Joyce from PRIME
        run: |
          python3 - <<'PY'
          import json,re,pathlib,copy
          D=pathlib.Path('PERFORMANCE35')
          AIR=json.load(open(D/'AIRLOCKS_v1.json'))
          def wc(s): return len(re.findall(r"\b[\w’'-]+\b",str(s)))
          def toks(xs):
              return re.findall(r"\b[\w’'-]+\b",' '.join(map(str,xs)))
          def split_sentences(p):
              return [x.strip() for x in re.split(r'(?<=[.!?])\s+',p) if x.strip()]
          def split_for_carry(p,goal):
              ss=split_sentences(p)
              if len(ss)<2:return None
              n=0; cut=0
              for i,s in enumerate(ss[:-1]):
                  n+=wc(s)
                  if n>=goal: cut=i+1; break
              if not cut: cut=max(1,len(ss)//2)
              a=' '.join(ss[:cut]); b=' '.join(ss[cut:])
              return (a,b) if wc(a)>=12 and wc(b)>=12 else None
          def paginate(paras,air):
              q=[str(p).strip() for p in paras if str(p).strip()]; pages=[]; carry=None; cycle=[28,48,68,38,58]; ci=0
              while q or carry:
                  out=[]
                  if carry: out.append(carry); carry=None
                  while q and sum(wc(x) for x in out)<285:
                      out.append(q.pop(0))
                  if q:
                      sp=split_for_carry(q[0],cycle[ci%len(cycle)]); ci+=1
                      if sp:
                          out.append(sp[0]); carry=sp[1]; q.pop(0)
                  if not out: break
                  pages.append({'paragraphs':out})
              if len(pages)>1 and sum(wc(x) for x in pages[-1]['paragraphs'])<190:
                  pages[-2]['paragraphs']+=pages[-1]['paragraphs']; pages.pop()
              for p in pages:
                  base=p['paragraphs']; ins=1 if len(base)>1 else 0
                  fp=list(base); fp.insert(ins,air)
                  p['force_paragraphs']=fp
                  p['word_count']=sum(wc(x) for x in base)
                  p['airlock_index']=ins
              return pages
          def norm(s):
              s=str(s).upper().replace('’',"'").replace('“','"').replace('”','"')
              s=re.sub(r'[^A-Z0-9]+',' ',s)
              return re.sub(r'\s+',' ',s).strip()
          text=pathlib.Path('index.html').read_text()
          toc=json.loads(re.search(r'const AUTH_TOC=(\{.*?\});function tocTitle',text,re.S).group(1))
          report=['# RUNYON / JOYCE GENUINE-BOUNDARY REBUILD QA','']
          # RUNYON — authoritative titles, in order, against untouched PRIME.
          src=json.load(open('PRIMED/DR_GUTS_PRIME2.json'))
          paras=[x for p in src['pages'] for x in p.get('paragraphs',[])]
          starts=[]; pos=0
          for title in toc['dr']:
              k=norm(title); hit=None
              for j in range(pos,len(paras)):
                  n=norm(paras[j])
                  if n==k or n.startswith(k+' ') or n.endswith(' '+k) or ('COLLECTION' in n and k in n):
                      hit=j; break
              if hit is None: raise SystemExit('Runyon title not found: '+title)
              starts.append((title,hit)); pos=hit+1
          rchap=[]
          for i,(title,a) in enumerate(starts):
              b=starts[i+1][1] if i+1<len(starts) else len(paras)
              genuine=paras[a:b]
              pages=paginate(genuine,AIR['DR'])
              if len(pages)<3: raise SystemExit(f'Runyon too short after pagination: {title}: {len(pages)}')
              if toks(genuine)!=toks([x for p in pages for x in p['paragraphs']]):
                  raise SystemExit('Runyon token sequence changed: '+title)
              rchap.append({'title':title,'pages':pages})
          runyon={'id':'dr','title':'On Broadway','author':'Damon Runyon','performance_version':'0.35-contents-repair','chapters':rchap}
          # JOYCE — source episode markers plus authentic Sirens opening where source lacks XI label.
          src=json.load(open('PRIMED/JJ_GUTS_PRIME2.json'))
          paras=[x for p in src['pages'] for x in p.get('paragraphs',[])]
          specs=[
            ('Telemachus',r'EPISODE\s+I\b'),('Nestor',r'EPISODE\s+II\b'),('Proteus',r'EPISODE\s+III\b'),
            ('Calypso',r'EPISODE\s+IV\b'),('Lotus Eaters',r'EPISODE\s+V\b'),('Hades',r'EPISODE\s+VI\b'),
            ('Aeolus',r'EPISODE\s+VII\b'),('Lestrygonians',r'EPISODE\s+VIII\b'),('Scylla and Charybdis',r'EPISODE\s+IX\b'),
            ('Wandering Rocks',r'EPISODE\s+X\b'),('Sirens',r'^Bronze by gold heard the hoofirons'),('Cyclops',r'EPISODE\s+XII\b'),
            ('Nausicaa',r'EPISODE\s+XIII\b'),('Oxen of the Sun',r'EPISODE\s+XIV\b'),('Circe',r'EPISODE\s+XV\b'),
            ('Eumaeus',r'EPISODE\s+XVI\b'),('Ithaca',r'EPISODE\s+XVII\b'),('Penelope',r'EPISODE\s+XVIII\b')]
          starts=[]; pos=0
          for title,pat in specs:
              rg=re.compile(pat,re.I); hit=None
              for j in range(pos,len(paras)):
                  if rg.search(str(paras[j]).strip()): hit=j; break
              if hit is None: raise SystemExit('Joyce opening not found: '+title)
              starts.append((title,hit)); pos=hit+1
          jchap=[]
          for i,(title,a) in enumerate(starts):
              b=starts[i+1][1] if i+1<len(starts) else len(paras)
              genuine=paras[a:b]
              pages=paginate(genuine,AIR['JJ'])
              if len(pages)<3: raise SystemExit(f'Joyce too short after pagination: {title}: {len(pages)}')
              if toks(genuine)!=toks([x for p in pages for x in p['paragraphs']]):
                  raise SystemExit('Joyce token sequence changed: '+title)
              jchap.append({'title':title,'pages':pages})
          joyce={'id':'jj','title':'Ulysses','author':'James Joyce','performance_version':'0.35-contents-repair','chapters':jchap}
          # Mechanical QA for both rebuilt books.
          for bid,book in [('Runyon',runyon),('Joyce',joyce)]:
              total=0
              report += [f'## {bid}',f'- chapters: {len(book["chapters"])}']
              for ci,c in enumerate(book['chapters'],1):
                  if len(c['pages'])<3: raise SystemExit(f'{bid} chapter <3 pages')
                  for p in c['pages']:
                      total+=1
                      if '$$$' in '\n'.join(p['paragraphs']): raise SystemExit(f'{bid} genuine text contains socket marker')
                      if '\n'.join(p['force_paragraphs']).count('$$$')!=1: raise SystemExit(f'{bid} bad socket count')
                  report.append(f'- {ci:02d}. {c["title"]}: {len(c["pages"])} pages; opens: {c["pages"][0]["paragraphs"][0][:90]}')
              report.append(f'- total pages: {total}')
              report.append('- socket QA: PASS — exactly one $$$ in every force_paragraphs page; none in genuine paragraphs')
              report.append('- genuine-token order QA: PASS')
              report.append('')
          for fn,obj in [('dr_035.json',runyon),('jj_035.json',joyce)]:
              raw=json.dumps(obj,ensure_ascii=False,separators=(',',':'))
              (D/fn).write_text(raw)
              pd=pathlib.Path('public/PERFORMANCE35'); pd.mkdir(parents=True,exist_ok=True)
              (pd/fn).write_text(raw)
          pathlib.Path('RUNYON_JOYCE_REBUILD_QA.md').write_text('\n'.join(report))
          PY
      - name: Commit branch-only rebuilt books
        run: |
          git config user.name 'GUTS repair'
          git config user.email 'actions@users.noreply.github.com'
          git add PERFORMANCE35/dr_035.json PERFORMANCE35/jj_035.json public/PERFORMANCE35/dr_035.json public/PERFORMANCE35/jj_035.json RUNYON_JOYCE_REBUILD_QA.md
          git commit -m 'Rebuild Runyon Joyce on genuine opening boundaries'
          git push origin HEAD:contents-repair
