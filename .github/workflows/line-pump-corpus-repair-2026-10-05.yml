name: Line pump corpus repair 2026-10-05

on:
  push:
    branches:
      - line-pump-corpus-repair-2026-10-05
    paths:
      - .github/line-pump-run-trigger-2026-10-05

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: line-pump-corpus-repair-2026-10-05
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Run rendered-line repair and QA
        id: qa
        continue-on-error: true
        run: python tools/line_pump_repair.py --write --report docs/checkpoints/2026-10-05_line-pump-corpus-repair.md
      - name: Commit QA result on safe branch
        run: |
          git config user.name "GUTS line-pump robot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/checkpoints/2026-10-05_line-pump-corpus-repair.md
          if [ "${{ steps.qa.outcome }}" = "success" ]; then
            git add PERFORMANCE35 PERFORMANCE10 public/PERFORMANCE35 public/PERFORMANCE10
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Record rendered-line pump QA"
            git push origin HEAD:line-pump-corpus-repair-2026-10-05
          fi
      - name: Enforce QA gate
        if: steps.qa.outcome != 'success'
        run: |
          echo "Line-pump QA HOLD; report committed, corpus not committed."
          exit 1
