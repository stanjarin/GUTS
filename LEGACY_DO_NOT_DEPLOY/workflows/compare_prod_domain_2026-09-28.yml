name: Compare custom domain to production version
on:
  push:
    branches: [contents-repair]
    paths: ['.github/workflows/compare_prod_domain.yml']
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: contents-repair}
      - name: Compare served HTML
        run: |
          curl -fsS --max-time 20 https://gutenbrg.com/ -o /tmp/domain.html
          curl -fsS --max-time 20 https://fc6f93f9-guts.stanjarin.workers.dev/ -o /tmp/version.html
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          d=Path('/tmp/domain.html').read_text()
          v=Path('/tmp/version.html').read_text()
          def grab(s,pat):
              m=re.search(pat,s,re.S); return m.group(0) if m else 'NOT FOUND'
          lines=[
            '# PRODUCTION DOMAIN COMPARISON','',
            'Domain SHA256: `'+hashlib.sha256(d.encode()).hexdigest()+'`',
            'Version SHA256: `'+hashlib.sha256(v.encode()).hexdigest()+'`','',
            'Identical full HTML: **'+('YES' if d==v else 'NO')+'**','',
            'Domain has carousel-mask: **'+('YES' if 'carousel-mask' in d else 'NO')+'**',
            'Version has carousel-mask: **'+('YES' if 'carousel-mask' in v else 'NO')+'**',
            'Domain has white carousel background: **'+('YES' if 'background:#fff' in grab(d,r'\.carousel-window\{[^}]+\}') else 'NO')+'**',
            'Version has white carousel background: **'+('YES' if 'background:#fff' in grab(v,r'\.carousel-window\{[^}]+\}') else 'NO')+'**','',
            '## Domain carousel CSS','```css',grab(d,r'\.carousel-window\{[^}]+\}'),'```','',
            '## Version carousel CSS','```css',grab(v,r'\.carousel-window\{[^}]+\}'),'```'
          ]
          Path('PRODUCTION_DOMAIN_COMPARISON_2026-09-28.md').write_text('\n'.join(lines))
          PY
      - name: Commit report
        run: |
          git config user.name 'GUTS inspector'
          git config user.email 'actions@users.noreply.github.com'
          git add PRODUCTION_DOMAIN_COMPARISON_2026-09-28.md
          git commit -m 'Compare production domain with unique version'
          git push origin HEAD:contents-repair