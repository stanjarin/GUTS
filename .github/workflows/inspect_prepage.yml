name: Inspect Pre-Page geometry
on:
  push:
    branches: [prepage-refresh-2026-09-28]
    paths: ['.github/workflows/inspect_prepage.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: prepage-refresh-2026-09-28}
      - run: pip install pillow
      - name: Inspect
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          lines=['# PRE-PAGE GEOMETRY','']
          for p in ['Pre-Page.jpg','public/Pre-Page.jpg']:
              im=Image.open(p).convert('RGB')
              lines += [f'## {p}',f'- size: {im.width} x {im.height}','']
          Path('PREPAGE_GEOMETRY_2026-09-28.md').write_text('\n'.join(lines))
          PY
      - name: Commit report
        run: |
          git config user.name 'GUTS inspector'
          git config user.email 'actions@users.noreply.github.com'
          git add PREPAGE_GEOMETRY_2026-09-28.md
          git commit -m 'Inspect Pre-Page geometry'
          git push origin HEAD:prepage-refresh-2026-09-28
