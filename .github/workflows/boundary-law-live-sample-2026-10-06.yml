name: Boundary-law live sample 2026-10-06

on:
  push:
    branches:
      - boundary-law-live-sample-2026-10-06
    paths:
      - tools/generate_boundary_live_sample.py
      - .github/workflows/boundary-law-live-sample-2026-10-06.yml

permissions:
  contents: write

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: boundary-law-live-sample-2026-10-06
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Generate five-page live sample
        run: python tools/generate_boundary_live_sample.py
      - name: Commit sample only
        run: |
          git config user.name "GUTS live-sample robot"
          git config user.email "actions@users.noreply.github.com"
          git add public/project_library/books/browse/boundary-law-live-sample.html
          git diff --cached --quiet || git commit -m "Generate live boundary-law phone sample"
          git push origin HEAD:boundary-law-live-sample-2026-10-06
