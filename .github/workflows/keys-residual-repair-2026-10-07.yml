name: Keys residual repair 2026-10-07

on:
  workflow_dispatch:
  push:
    branches:
      - keys-factory-scope-2026-10-07
    paths:
      - .github/keys-residual-trigger-2026-10-07
      - tools/keys_residual_repair.py
      - .github/workflows/keys-residual-repair-2026-10-07.yml

concurrency:
  group: keys-residual-repair-2026-10-07
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: keys-factory-scope-2026-10-07
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile tools/keys_residual_repair.py
      - name: Install Python dependency
        run: pip install playwright
      - name: Run targeted residual repair
        id: qa
        continue-on-error: true
        run: python tools/keys_residual_repair.py
      - name: Commit report and candidate on PASS
        run: |
          git config user.name "GUTS Keys residual robot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/checkpoints/2026-10-07_keys-residual-repair-report.md
          if [ "${{ steps.qa.outcome }}" = "success" ]; then
            git add PERFORMANCE10/keys_performance.json public/PERFORMANCE10/keys_performance.json
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Record Keys residual repair QA"
            git push origin HEAD:keys-factory-scope-2026-10-07
          fi
      - name: Enforce QA gate
        if: steps.qa.outcome != 'success'
        run: exit 1
