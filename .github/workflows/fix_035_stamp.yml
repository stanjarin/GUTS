name: Fix GUTS 0.35 build stamp
on:
  push:
    paths: ['.github/workflows/fix_035_stamp.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct build stamp and keep served copy in sync
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ('index.html', 'public/index.html'):
              p = Path(name)
              s = p.read_text()
              old = '<span class="buildstamp">0.34</span>'
              new = '<span class="buildstamp">0.35</span>'
              if old not in s:
                  raise SystemExit(f'{name}: 0.34 build stamp not found; refusing unsafe edit')
              p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit corrected stamp
        run: |
          git config user.name 'GUTS builder'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html public/index.html
          git commit -m 'Correct GUTS build stamp to 0.35'
          git push
