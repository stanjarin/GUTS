name: Keys factory scope 2026-10-07

on:
  workflow_dispatch:
  push:
    branches:
      - keys-factory-scope-2026-10-07
    paths:
      - .github/keys-factory-scope-trigger-2026-10-07
      - tools/keys_factory_scope.py
      - .github/workflows/keys-factory-scope-2026-10-07.yml

concurrency:
  group: keys-factory-scope-2026-10-07
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: keys-factory-scope-2026-10-07
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile tools/keys_factory_scope.py
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Run single-book factory scope trial
        id: qa
        continue-on-error: true
        run: python tools/keys_factory_scope.py --write --report docs/checkpoints/2026-10-07_keys-factory-scope-report.md
      - name: Commit QA result on safe branch
        run: |
          git config user.name "GUTS Keys scope robot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/checkpoints/2026-10-07_keys-factory-scope-report.md
          # Safe-branch scope trial: retain generated candidate even on QA HOLD
          # so residual pages can be diagnosed and repaired without rerunning blind.
          git add PERFORMANCE10 public/PERFORMANCE10
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Record Keys single-book factory scope QA"
            git push origin HEAD:keys-factory-scope-2026-10-07
          fi
      - name: Enforce QA gate
        if: steps.qa.outcome != 'success'
        run: |
          echo "Keys scope QA HOLD; report committed, corpus not committed."
          exit 1
