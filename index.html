<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="guts-build" content="v0.30-poet-pass">
<title>Project Gutenberg — Books</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Helvetica,sans-serif;color:#222;background:#fff;overscroll-behavior-y:none}
body{overflow-x:hidden}#app{max-width:430px;margin:auto;min-height:100vh;overflow:hidden;background:#fff}
.artpage{position:relative;width:100%;overflow:hidden;background:#fff}.artpage>.base{display:block;width:100%;height:auto}
.gateway-art .hot{position:absolute;left:6%;right:6%;height:4.8%;border:0;background:transparent;padding:0;cursor:pointer;touch-action:manipulation}
.gateway-art .h1{top:34.9%}.gateway-art .h2{top:39.2%}.gateway-art .h3{top:43.5%}.gateway-art .h4{top:47.8%}
.landing-art{overflow:hidden}.buildstamp{position:absolute;right:9px;bottom:7px;z-index:5;font:10px/1 Helvetica,sans-serif;color:#777;letter-spacing:.02em;pointer-events:none}
.carousel-window{position:absolute;left:5.5%;right:5.5%;top:30.5%;height:18.2%;overflow-x:auto;overflow-y:hidden;border-radius:0 0 14px 14px;-webkit-overflow-scrolling:touch;overscroll-behavior-x:auto;scrollbar-width:none;touch-action:pan-x}.carousel-window::-webkit-scrollbar{display:none}
.carousel-track{position:relative;height:100%;width:max-content}.carousel-track img{display:block;height:100%;width:auto;max-width:none;-webkit-user-drag:none;user-select:none}.carousel-links{position:absolute;inset:0;display:grid;grid-template-columns:repeat(9,1fr)}.carousel-links button{border:0;background:transparent;padding:0;cursor:pointer;touch-action:manipulation}.suggestions-overlay{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;z-index:3;transform:translateY(4px)}
.top{height:44px;display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid #d4d4d4;position:sticky;top:0;background:#fff;z-index:4;font-family:Arial,Helvetica,sans-serif}.top b{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;font-weight:600}.top button{border:0;background:none;font:22px/1 Arial,Helvetica,sans-serif;padding:6px 9px;color:#222;touch-action:manipulation}
.coverstage{position:relative;min-height:100vh;background:#f8f7f3;display:flex;align-items:flex-start;justify-content:center;padding:42px 18px 34px;overflow:hidden}.coverstage img{display:block;max-width:92%;max-height:86vh;width:auto;height:auto;box-shadow:0 2px 7px rgba(0,0,0,.18);cursor:pointer;touch-action:manipulation}.coverstage .coverback{position:absolute;left:8px;top:8px;border:0;background:rgba(248,247,243,.9);font:27px/1 Arial,sans-serif;padding:7px 11px;z-index:2;color:#333}
.contents-wrap{min-height:100vh;background:#fff}.contents{padding:20px 18px 42px;font-family:Georgia,"Times New Roman",serif}.contents h1{font:normal 26px/1.15 Georgia,"Times New Roman",serif;margin:4px 0 18px;border-bottom:1px solid #aaa;padding-bottom:8px}.chapter{display:block;width:100%;text-align:left;padding:11px 3px;border:0;border-bottom:1px solid #ddd;background:#fff;font:16px/1.28 Georgia,"Times New Roman",serif;color:#0645ad;text-decoration:underline;touch-action:manipulation}
.reader-wrap{min-height:100vh;background:#fff}.reader{height:calc(100vh - 44px);position:relative;background:#fff;overflow:hidden}.page{height:100%;overflow:auto;padding:22px 21px 58px;font:18px/1.48 Georgia,"Times New Roman",serif;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}.page p{margin:0 0 .82em}.page p:first-child{margin-top:0}.pageno{position:absolute;bottom:9px;left:0;right:0;text-align:center;font:11px Arial,Helvetica,sans-serif;color:#777;pointer-events:none}.hit{position:absolute;top:0;bottom:38px;width:18%;z-index:3}.left{left:0}.right{right:0}
</style></head><body><div id="app"></div>
<script>
const META=[
{id:"aam",title:"The House at Pooh Corner",author:"A. A. Milne",file:"PRIMED/AAM_GUTS_PRIME2.json"},
{id:"jeeves",title:"Right Ho, Jeeves!",author:"P. G. Wodehouse",file:"https://raw.githubusercontent.com/stanjarin/NoBoNoFo/main/books/jeeves.json",legacy:true},
{id:"farewell",title:"A Farewell to Arms",author:"Ernest Hemingway",file:"https://raw.githubusercontent.com/stanjarin/NoBoNoFo/main/books/farewell.json",legacy:true},
{id:"aam2",title:"The House at Pooh Corner",author:"A. A. Milne",alias:"aam"},
{id:"huck",title:"Adventures of Huckleberry Finn",author:"Mark Twain",file:"https://raw.githubusercontent.com/stanjarin/NoBoNoFo/main/books/huck.json",legacy:true},
{id:"dp",title:"Men I’m Not Married To",author:"Dorothy Parker",file:"PRIMED/DP_GUTS_PRIME2.json"},
{id:"dr",title:"On Broadway",author:"Damon Runyon",file:"PRIMED/DR_GUTS_PRIME2.json"},
{id:"ac",title:"The Murder at the Vicarage",author:"Agatha Christie",file:"PRIMED/AC_GUTS_PRIME2.json"},
{id:"jj",title:"Ulysses",author:"James Joyce",file:"PRIMED/JJ_GUTS_PRIME2.json"},
{id:"jt",title:"My Life and Hard Times",author:"James Thurber",file:"PRIMED/JT_GUTS_PRIME2.json"}];
const DISPLAY=["jt","jeeves","farewell","aam","huck","dp","dr","ac","jj"];
const BIG_COVERS={jt:"THURBER.jpg",jeeves:"JEEVES.jpg",farewell:"HEMINGWAY.jpg",aam:"POOH.jpg",huck:"HUCK.jpg",dp:"PARKER.jpg",dr:"RUNYON.jpg",ac:"CHRISTIE.jpg",jj:"JOYCE.jpg"};
let state={screen:"gateway",book:null,ci:0,pi:0,homeScroll:0,contentsScroll:0};
const cache=new Map(),KEY="guts-magic-v01",REMOTE_KEY="guts-remote-revision-v01";
let magic=Object.assign({phase:"READY",force:"",paid:null,dwell:null,selectedChapter:null},JSON.parse(sessionStorage.getItem(KEY)||"{}"));
const save=()=>sessionStorage.setItem(KEY,JSON.stringify(magic));
function applyRemoteState(remote){if(!remote||!["READY","ARMED","CLEAN"].includes(remote.phase))return false;const revision=Number(remote.revision||0),seen=Number(sessionStorage.getItem(REMOTE_KEY)||0);if(revision<=seen)return false;if(remote.phase==="ARMED"&&String(remote.word||"").trim()){if(magic.phase!=="PAID")magic={phase:"ARMED",force:String(remote.word).trim(),paid:null,dwell:null,selectedChapter:null}}else if(remote.phase==="CLEAN"){magic={phase:"CLEAN",force:"",paid:null,dwell:null,selectedChapter:null}}else if(remote.phase==="READY"&&(magic.phase==="READY"||magic.phase==="CLEAN")){magic={phase:"READY",force:"",paid:null,dwell:null,selectedChapter:null}}sessionStorage.setItem(REMOTE_KEY,String(revision));save();return true}
async function pullRemoteState(){try{const r=await fetch("/api/state",{cache:"no-store",headers:{"Accept":"application/json"}});if(!r.ok)return false;return applyRemoteState(await r.json())}catch(e){return false}}
const esc=s=>String(s).replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'\"':"&quot;"}[c]));
function meta(id){return META.find(x=>x.id===id)}
async function load(id){if(cache.has(id))return cache.get(id);const m=meta(id);let raw=await(await fetch(m.file,{cache:"no-store"})).json(),b;if(m.legacy){b={id:m.id,title:m.title,author:m.author,chapters:raw.chapters}}else{const groups=[];let current={title:"Book",pages:[]};raw.pages.forEach(p=>{const ch=p.paragraphs.find(x=>/^CHAPTER\b|^COLLECTION\b|^(TELEMACHUS|NESTOR|PROTEUS|CALYPSO|LOTUS|HADES|AEOLUS|LESTRYGONIANS|SCYLLA|WANDERING|SIRENS|CYCLOPS|NAUSICAA|OXEN|CIRCE|EUMAEUS|ITHACA|PENELOPE)/i.test(x));if(ch&&current.pages.length){groups.push(current);current={title:ch,pages:[]}};current.pages.push({paragraphs:p.paragraphs,force_paragraphs:p.force_paragraphs})});if(current.pages.length)groups.push(current);b={id:m.id,title:m.title,author:m.author,chapters:groups}}cache.set(id,b);return b}
function key(){return state.book?state.book.id+":"+state.ci+":"+state.pi:""}function current(){return state.book.chapters[state.ci].pages[state.pi]}function inject(s){return magic.force?String(s).split("$$").join(magic.force):s}
function visible(p){const k=key();const protectedOpener=state.pi===0&&magic.selectedChapter&&magic.selectedChapter.book===state.book.id&&magic.selectedChapter.ci===state.ci;const forceHere=!protectedOpener&&(magic.phase==="ARMED"||(magic.phase==="PAID"&&magic.paid===k));return(forceHere&&p.force_paragraphs?p.force_paragraphs:p.paragraphs).map(x=>forceHere?inject(x):x)}
function dwell(){clearTimeout(magic._timer);if(magic.phase!=="ARMED")return;const p=current(),k=key();const protectedOpener=state.pi===0&&magic.selectedChapter&&magic.selectedChapter.book===state.book.id&&magic.selectedChapter.ci===state.ci;if(!p.force_paragraphs||protectedOpener)return;magic.dwell={key:k,qualified:false};magic._timer=setTimeout(()=>{if(magic.phase==="ARMED"&&key()===k&&magic.dwell?.key===k){magic.dwell.qualified=true;save()}},6000)}
function depart(){const k=key();if(magic.phase==="ARMED"&&magic.dwell?.qualified&&magic.dwell.key===k){magic.phase="PAID";magic.paid=k;magic.dwell=null;save()}}
function motion(change,dir=1,after){const a=document.getElementById("app"),old=a.firstElementChild;if(!old||matchMedia("(prefers-reduced-motion: reduce)").matches){change();render();if(after)after();return}old.animate([{transform:"translateX(0)",opacity:1},{transform:`translateX(${-dir*28}%)`,opacity:.9}],{duration:145,easing:"ease-in",fill:"forwards"}).finished.then(()=>{change();render();const fresh=a.firstElementChild;if(fresh)fresh.animate([{transform:`translateX(${dir*100}%)`},{transform:"translateX(0)"}],{duration:235,easing:"cubic-bezier(.2,.75,.22,1)"});if(after)after()})}
function home(){state.screen="home";state.book=null;state.ci=0;state.pi=0;render();requestAnimationFrame(()=>scrollTo(0,state.homeScroll||0))}
function gatewayChoice(){state.screen="home";state.homeScroll=0;render();scrollTo(0,0)}
async function openBook(id){state.homeScroll=scrollY;state.book=await load(id);state.screen="cover";state.ci=0;state.pi=0;render();scrollTo(0,0)}
function openContents(){motion(()=>{state.screen="contents";state.contentsScroll=0},1)}
function openChapter(i){state.contentsScroll=scrollY;motion(()=>{state.ci=i;state.pi=0;if(magic.phase==="ARMED")magic.selectedChapter={book:state.book.id,ci:i};save();state.screen="reader"},1,dwell)}
function backToContents(){motion(()=>{state.screen="contents"},-1,()=>requestAnimationFrame(()=>scrollTo(0,state.contentsScroll||0)))}
function turn(d){depart();motion(()=>{let n=state.pi+d;if(n<0){if(state.ci>0){state.ci--;state.pi=state.book.chapters[state.ci].pages.length-1}}else if(n>=state.book.chapters[state.ci].pages.length){if(state.ci<state.book.chapters.length-1){state.ci++;state.pi=0}}else state.pi=n},d,dwell)}
function render(){const a=document.getElementById("app");if(state.screen==="gateway"){a.innerHTML='<div class="artpage gateway-art"><img class="base" src="Pre-Page.jpg" alt=""><button class="hot h1" aria-label="Recent additions" onclick="gatewayChoice()"></button><button class="hot h2" aria-label="Popular titles" onclick="gatewayChoice()"></button><button class="hot h3" aria-label="Reader recommendations" onclick="gatewayChoice()"></button><button class="hot h4" aria-label="Staff picks" onclick="gatewayChoice()"></button></div>';return}if(state.screen==="home"){a.innerHTML='<div class="artpage landing-art"><img class="base" src="LANDING%20PAGE.jpg" alt=""><div class="carousel-window"><div class="carousel-track"><img src="Carousel.jpg" alt=""><div class="carousel-links">'+DISPLAY.map(id=>'<button aria-label="'+esc(meta(id).title)+'" onclick="openBook(\''+id+'\')"></button>').join("")+'</div></div></div><img class="suggestions-overlay" src="Suggestions.png" alt=""><span class="buildstamp">0.30</span></div>';return}if(state.screen==="cover"){a.innerHTML='<div class="coverstage"><button class="coverback" aria-label="Back" onclick="home()">‹</button><img src="'+BIG_COVERS[state.book.id]+'" alt="'+esc(state.book.title)+' cover" onclick="openContents()"></div>';return}if(state.screen==="contents"){a.innerHTML='<div class="contents-wrap"><div class="top"><button aria-label="Back to books" onclick="home()">‹</button><b>'+esc(state.book.title)+'</b></div><div class="contents"><h1>Contents</h1>'+state.book.chapters.map((c,i)=>'<button class="chapter" onclick="openChapter('+i+')">'+esc(c.title||("Chapter "+(i+1)))+'</button>').join("")+'</div></div>';return}const p=current(),paras=visible(p);a.innerHTML='<div class="reader-wrap"><div class="top"><button aria-label="Contents" onclick="backToContents()">☰</button><b>'+esc(state.book.title)+'</b></div><div class="reader"><div class="page">'+paras.map(x=>'<p>'+esc(x)+'</p>').join("")+'</div><div class="hit left" onclick="turn(-1)"></div><div class="hit right" onclick="turn(1)"></div><div class="pageno">'+(state.pi+1)+'</div></div></div>'}
pullRemoteState().finally(render);setInterval(pullRemoteState,2500);
</script></body></html>
