name = "guts"
main = "src/worker.js"
compatibility_date = "2026-09-20"

[[kv_namespaces]]
binding = "GUTS_STATE"
id = "85ae7131c91e492abb79aca57d6817a6"

# Encrypted Worker secrets required at runtime: GUTS_PUSH_SECRET, GUTS_ARM_PIN, GUTS_SITE_PIN.
# Values are set in Cloudflare only. Never put secret values in this file or spectator-side JavaScript.
# IMPORTANT: GitHub/Wrangler deployments must preserve all three secret bindings.

[assets]
directory = "../"
run_worker_first = ["/api/*"]
