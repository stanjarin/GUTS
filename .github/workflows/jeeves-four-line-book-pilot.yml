name: Jeeves full book four line pump pilot
on:
  push:
    branches: [audit-short-pages-2026-10-10]
    paths: [.github/workflows/jeeves-four-line-book-pilot.yml]
jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 57f46e3961f6e9bcb1f89040eac65d9546c900f5
      - run: |
          pip install playwright
          python -m playwright install chromium
      - name: Four-line full-book pilot, zero publication
        run: |
          python3 - <<'PY'
          import json,re,copy,collections
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          d=json.load(open('public/PERFORMANCE35/jeeves_035.json'))
          orig=copy.deepcopy(d); totals=collections.Counter()
          token=lambda pages:re.findall(r'\S+',' '.join(str(x) for p in pages for x in p.get('force_paragraphs',[]) if '$$$' not in str(x)))
          css='body{margin:0}.page{padding:25px 15px 58px;font:15px/1.45 Georgia,serif}.page p{width:329px;margin:0 auto .72em}.page p+p{text-indent:1.5em}'
          with sync_playwright() as pw:
            b=pw.chromium.launch();pg=b.new_page(viewport={'width':414,'height':736});pg.set_content('<style>'+css+'</style><div class="page"></div>')
            js="""arr=>{let p=document.querySelector('.page'),out=[];for(let s of arr){p.innerHTML='';let x=document.createElement('p');x.textContent=s;p.appendChild(x);let r=document.createRange();r.selectNodeContents(x);let yy=[];for(let z of r.getClientRects())if(z.width&&z.height&&!yy.some(t=>Math.abs(t-z.top)<.75))yy.push(z.top);out.push(yy.length+1)}return out}"""
            def line(s):return pg.evaluate(js,[s])[0]
            def pos(p):
              f=p.get('force_paragraphs') or [];a=next((i for i,x in enumerate(f) if '$$$' in str(x)),None)
              return (line(' '.join(map(str,f[:a]))),a) if a is not None else (None,None)
            def defects(ch):
              out=[]
              for pi,p in enumerate(ch['pages']):
                q,_=pos(p)
                if q is not None:out.append((pi,q))
              pairs=[(a,b) for a,b in zip(out,out[1:]) if abs(a[1]-b[1])<4]
              triples=[(a,b,c) for a,b,c in zip(out,out[1:],out[2:]) if max(a[1],b[1],c[1])-min(a[1],b[1],c[1])<=4]
              return out,pairs,triples
            print('JEEVES_BOOK_PILOT_BEGIN',flush=True)
            for ci,ch in enumerate(d['chapters']):
              pages=ch['pages'];before=token(pages);initial,pairs0,trips0=defects(ch)
              totals['initial_pair_faults']+=len(pairs0);totals['initial_triple_faults']+=len(trips0);totals['socket_pages']+=len(initial)
              for pi in range(1,len(pages)):
                current,ai=pos(pages[pi])
                if ai is None or ai!=1:continue
                previous,prev_ai=pos(pages[pi-1])
                following,_=pos(pages[pi+1]) if pi+1<len(pages) else (None,None)
                if previous is None:continue
                if abs(current-previous)>=4 and (following is None or abs(current-following)>=4):continue
                pf=pages[pi-1]['force_paragraphs'];cf=pages[pi]['force_paragraphs']
                if not pf or '$$$' in str(pf[-1]):continue
                prev=str(pf[-1]);carry=str(cf[0]);opts=[]
                for direction in (0,1):
                  tokens=(prev if direction==0 else carry).split()
                  for k in range(2,min(50,len(tokens)-8)):
                    if direction==0:np=' '.join(tokens[:-k]);nc=' '.join(tokens[-k:])+' '+carry
                    else:np=prev+' '+' '.join(tokens[:k]);nc=' '.join(tokens[k:])
                    if not np.strip() or not nc.strip():continue
                    n=line(nc)
                    if abs(n-previous)<4 or (following is not None and abs(n-following)<4):continue
                    # Prefer retaining the 8/12/16/10/14 shape after satisfying separation
                    aim=[8,12,16,10,14][(pi-1)%5]
                    opts.append((abs(n-aim),k,np,nc,n))
                if not opts:totals['unresolved_pages']+=1;continue
                _,_,np,nc,n=min(opts,key=lambda x:(x[0],x[1]))
                pf[-1]=np;cf[0]=nc
                if token(pages)!=before:
                  pf[-1]=prev;cf[0]=carry;totals['integrity_rejected']+=1;continue
                totals['moved']+=1
              after,pairs1,trips1=defects(ch)
              totals['final_pair_faults']+=len(pairs1);totals['final_triple_faults']+=len(trips1)
              if token(pages)!=before:totals['integrity_failure']+=1
              if any(p['paragraphs']!=q['paragraphs'] for p,q in zip(pages,orig['chapters'][ci]['pages'])):totals['genuine_changed']+=1
              if any(sum('$$$' in str(s) for s in p.get('force_paragraphs',[]))!=sum('$$$' in str(s) for s in q.get('force_paragraphs',[])) for p,q in zip(pages,orig['chapters'][ci]['pages'])):totals['socket_changed']+=1
              if len(pairs1)>len(pairs0) or len(trips1)>len(trips0):totals['chapters_worsened']+=1
            b.close()
          print('TOTAL',dict(totals),flush=True)
          ok=not any(totals[k] for k in ('integrity_failure','genuine_changed','socket_changed','chapters_worsened')) and totals['final_pair_faults']<=totals['initial_pair_faults']
          print('JEEVES_BOOK_VERDICT', 'PASS' if ok else 'HOLD',flush=True)
          print('JEEVES_BOOK_PILOT_END',flush=True)
          if not ok:raise SystemExit(2)
          PY
