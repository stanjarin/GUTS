name: GUTS 0.35 Reader deployment
on:
  push:
    paths: ['.github/workflows/guts035_deploy.yml']
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire 0.35 corpus into Reader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          s=s.replace('v0.34-reader-toc','v0.35-performance-reader')
          old='const META=[{id:"aam",title:"The House at Pooh Corner",author:"A. A. Milne",file:"PRIMED/AAM_GUTS_PRIME2.json"},{id:"jeeves",title:"Right Ho, Jeeves!",author:"P. G. Wodehouse",file:"https://raw.githubusercontent.com/stanjarin/NoBoNoFo/main/books/jeeves.json",legacy:true},{id:"farewell",title:"A Farewell to Arms",author:"Ernest Hemingway",file:"https://raw.githubusercontent.com/stanjarin/NoBoNoFo/main/books/farewell.json",legacy:true},{id:"huck",title:"Adventures of Huckleberry Finn",author:"Mark Twain",file:"https://raw.githubusercontent.com/stanjarin/NoBoNoFo/main/books/huck.json",legacy:true},{id:"dp",title:"Men I’m Not Married To",author:"Dorothy Parker",file:"PRIMED/DP_GUTS_PRIME2.json"},{id:"dr",title:"On Broadway",author:"Damon Runyon",file:"PRIMED/DR_GUTS_PRIME2.json"},{id:"ac",title:"The Murder at the Vicarage",author:"Agatha Christie",file:"PRIMED/AC_GUTS_PRIME2.json"},{id:"jj",title:"Ulysses",author:"James Joyce",file:"PRIMED/JJ_GUTS_PRIME2.json"},{id:"jt",title:"My Life and Hard Times",author:"James Thurber",file:"PRIMED/JT_GUTS_PRIME2.json"}];const DISPLAY=["jt","jeeves","farewell","aam","huck","dp","dr","ac","jj"];'
          new='const META=[{id:"aam",title:"The House at Pooh Corner",author:"A. A. Milne",file:"PERFORMANCE35/aam_035.json",legacy:true},{id:"jeeves",title:"Right Ho, Jeeves!",author:"P. G. Wodehouse",file:"PERFORMANCE35/jeeves_035.json",legacy:true},{id:"farewell",title:"A Farewell to Arms",author:"Ernest Hemingway",file:"PERFORMANCE35/farewell_035.json",legacy:true},{id:"huck",title:"Adventures of Huckleberry Finn",author:"Mark Twain",file:"PERFORMANCE35/huck_035.json",legacy:true},{id:"dr",title:"On Broadway",author:"Damon Runyon",file:"PERFORMANCE35/dr_035.json",legacy:true},{id:"ac",title:"The Murder at the Vicarage",author:"Agatha Christie",file:"PERFORMANCE35/ac_035.json",legacy:true},{id:"jj",title:"Ulysses",author:"James Joyce",file:"PERFORMANCE35/jj_035.json",legacy:true},{id:"jt",title:"My Life and Hard Times",author:"James Thurber",file:"PERFORMANCE35/jt_035.json",legacy:true}];const DISPLAY=["jt","jeeves","farewell","aam","huck","dr","ac","jj"];'
          if old not in s: raise SystemExit('META signature not found; refusing unsafe deploy')
          s=s.replace(old,new)
          s=s.replace('grid-template-columns:repeat(9,1fr)','grid-template-columns:repeat(8,1fr)')
          # Parker has no live 0.35 slot; keep source/assets untouched in repo.
          p.write_text(s)
          PY
      - name: Commit live 0.35
        run: |
          git config user.name 'GUTS builder'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Deploy GUTS 0.35 performance Reader'
          git push
