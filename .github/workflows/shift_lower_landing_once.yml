name: SHIFT LOWER LANDING ONCE

on:
  push:
    branches:
      - prepage-refresh-2026-09-28
    paths:
      - LANDING_SHIFT_TRIGGER.txt

permissions:
  contents: write

jobs:
  shift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prepage-refresh-2026-09-28
          fetch-depth: 0

      - name: Build shifted landing artwork losslessly
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          src=Path("LANDING PAGE.jpg")
          out=Path("LANDING_PAGE_041.png")
          im=Image.open(src).convert("RGB")

          split_y=3900
          shift=240

          canvas=Image.new("RGB",(im.width,im.height+shift),"white")
          canvas.paste(im.crop((0,0,im.width,split_y)),(0,0))
          canvas.paste(im.crop((0,split_y,im.width,im.height)),(0,split_y+shift))
          canvas.save(out,"PNG",optimize=False)

          Path("public").mkdir(exist_ok=True)
          Path("public/LANDING_PAGE_041.png").write_bytes(out.read_bytes())

          print("SHIFTED LANDING",im.size,"->",canvas.size,"split",split_y,"shift",shift)
          PY

      - name: Wire shifted artwork
        shell: python
        run: |
          from pathlib import Path

          for name in ("index.html","public/index.html"):
              p=Path(name)
              s=p.read_text(encoding="utf-8")
              s=s.replace('src="LANDING%20PAGE.jpg"','src="LANDING_PAGE_041.png"')
              s=s.replace(
                  '.suggestions-overlay{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;',
                  '.suggestions-overlay{position:absolute;left:0;top:0;width:100%;height:auto;object-fit:fill;'
              )
              s=s.replace('<span class="buildstamp">0.40</span>','<span class="buildstamp">0.41</span>')
              p.write_text(s,encoding="utf-8")

      - name: QA
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image
          import hashlib

          a=Path("LANDING_PAGE_041.png")
          b=Path("public/LANDING_PAGE_041.png")
          if hashlib.sha256(a.read_bytes()).digest()!=hashlib.sha256(b.read_bytes()).digest():
              raise SystemExit("landing root/public mismatch")
          if Image.open(a).size!=(2048,8240):
              raise SystemExit("unexpected landing dimensions")
          r=Path("index.html").read_text(encoding="utf-8")
          p=Path("public/index.html").read_text(encoding="utf-8")
          if r!=p:
              raise SystemExit("index root/public mismatch")
          if 'LANDING_PAGE_041.png' not in r or 'buildstamp">0.41' not in r:
              raise SystemExit("landing wiring/build stamp missing")
          if 'height:auto;object-fit:fill' not in r:
              raise SystemExit("suggestions overlay aspect fix missing")
          print("LANDING LOWER SHIFT QA: PASS")

      - name: Commit and quarantine
        shell: bash
        run: |
          set -euo pipefail
          git rm -f LANDING_SHIFT_TRIGGER.txt
          mkdir -p LEGACY_DO_NOT_DEPLOY/workflows
          git mv .github/workflows/shift_lower_landing_once.yml LEGACY_DO_NOT_DEPLOY/workflows/shift_lower_landing_once_2026-10-01.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move lower landing content below enlarged carousel"
          git push origin prepage-refresh-2026-09-28
