name: Production-path top-airlock premerge QA
on:
  push:
    branches: [promote-top-airlock-2026-10-10]
    paths: [.github/workflows/top-airlock-premerge-qa.yml]
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install playwright
          python -m playwright install chromium
      - name: Test mirrored files, all pages and existing magic protocol
        run: |
          python3 -m http.server 8765 --directory public >/tmp/top-airlock-http.log 2>&1 &
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import re,time
          files=['index.html','public/index.html','public/project_library/books/browse/index.html']
          contents=[Path(q).read_bytes() for q in files]
          assert len(set(contents))==1,'Reader mirror drift'
          assert b'<base href="/">' in contents[0]
          with sync_playwright() as pw:
            browser=pw.chromium.launch()
            page=browser.new_page(viewport={'width':375,'height':667})
            page.goto('http://127.0.0.1:8765/?browse=1')
            results=page.evaluate("""async()=>{
              let c={books:0,pages:0,missing:0,wrongHead:0},examples=[];
              for(const m of META){
                const b=await load(m.id);c.books++;
                for(let ci=0;ci<b.chapters.length;ci++)
                  for(let pi=0;pi<b.chapters[ci].pages.length;pi++){
                    state.book=b;state.ci=ci;state.pi=pi;
                    const out=topAirlockEdition();
                    const ix=out.findIndex(x=>String(x).includes('$$$'));
                    c.pages++;
                    if(ix<0){c.missing++;examples.push([m.id,ci,pi,'missing'])}
                    else if(out[ix+1]&&!/^(?:["“‘'(\\[]\\s*)*[A-Z]/.test(String(out[ix+1]))){c.wrongHead++;examples.push([m.id,ci,pi,'head'])}
                  }
              }
              return {c,examples:examples.slice(0,10)}
            }""")
            print('FULL_CORPUS',results,flush=True)
            assert results['c']['books']==18
            assert results['c']['pages']==4858
            assert results['c']['missing']==results['c']['wrongHead']==0
            page.goto('http://127.0.0.1:8765/')
            a=page.evaluate("""async()=>{
              state.book=await load('ripley');state.ci=0;state.pi=0;
              applyRemoteState({phase:'READY',revision:40001,word:''});
              const clear=!topAirlockEdition().some(x=>String(x).includes('GOPHERS'));
              applyRemoteState({phase:'ARMED',revision:40002,word:'GOPHERS'});
              magic.selectedChapter={book:'ripley',ci:0};
              const armed=topAirlockEdition().some(x=>String(x).includes('GOPHERS'));
              dwell();
              return {clear,armed,dwell:!!magic.dwell};
            }""")
            print('ARMED',a,flush=True)
            assert all(a.values()),a
            time.sleep(6.4)
            q=page.evaluate("""()=>{
              const qualified=!!magic.dwell?.qualified;
              depart();const paid=magic.phase==='PAID'&&magic.paid===key();
              const persists=topAirlockEdition().some(x=>String(x).includes('GOPHERS'));
              applyRemoteState({phase:'READY',revision:40003,word:''});
              const reset=magic.phase==='READY'&&!topAirlockEdition().some(x=>String(x).includes('GOPHERS'));
              return {qualified,paid,persists,reset};
            }""")
            print('PAYOFF',q,flush=True)
            assert all(q.values()),q
            print('PRODUCTION_PATH_QA_PASS',flush=True)
            browser.close()
          PY
