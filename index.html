const META=[{id:"aam",title:"The House at Pooh Corner",author:"A. A. Milne",file:"PERFORMANCE35/aam_035.json",legacy:true},{id:"jeeves",title:"Right Ho, Jeeves!",author:"P. G. Wodehouse",file:"PERFORMANCE35/jeeves_035.json",legacy:true},{id:"farewell",title:"A Farewell to Arms",author:"Ernest Hemingway",file:"PERFORMANCE35/farewell_035.json",legacy:true},{id:"huck",title:"Adventures of Huckleberry Finn",author:"Mark Twain",file:"PERFORMANCE35/huck_035.json",legacy:true},{id:"dp",title:"Men I’m Not Married To",author:"Dorothy Parker",file:"PRIMED/DP_GUTS_PRIME2.json"},{id:"dr",title:"On Broadway",author:"Damon Runyon",file:"PERFORMANCE35/dr_035.json",legacy:true},{id:"ac",title:"The Murder at the Vicarage",author:"Agatha Christie",file:"PERFORMANCE35/ac_035.json",legacy:true},{id:"jj",title:"Ulysses",author:"James Joyce",file:"PERFORMANCE35/jj_035.json",legacy:true},{id:"jt",title:"My Life and Hard Times",author:"James Thurber",file:"PERFORMANCE35/jt_035.json",legacy:true}];const DISPLAY=["jt","jeeves","farewell","aam","huck","dp","dr","ac","jj"];const BIG_COVERS={jt:"THURBER.jpg",jeeves:"JEEVES.jpg",farewell:"HEMINGWAY.jpg",aam:"POOH.jpg",huck:"HUCK.jpg",dp:"PARKER.jpg",dr:"RUNYON.jpg",ac:"CHRISTIE.jpg",jj:"JOYCE.jpg"};let state={screen:"gateway",book:null,ci:0,pi:0,homeScroll:0,contentsScroll:0};const cache=new Map(),KEY="guts-magic-v01",REMOTE_KEY="guts-remote-revision-v01";let magic=Object.assign({phase:"READY",force:"",paid:null,dwell:null,selectedChapter:null},JSON.parse(sessionStorage.getItem(KEY)||"{}"));const save=()=>sessionStorage.setItem(KEY,JSON.stringify(magic));
function applyRemoteState(r){if(!r||!["READY","ARMED","CLEAN"].includes(r.phase))return false;const rev=Number(r.revision||0),seen=Number(sessionStorage.getItem(REMOTE_KEY)||0);if(rev<=seen)return false;if(r.phase==="ARMED"&&String(r.word||"").trim()){if(magic.phase!=="PAID")magic={phase:"ARMED",force:String(r.word).trim(),paid:null,dwell:null,selectedChapter:null}}else if(r.phase==="CLEAN")magic={phase:"CLEAN",force:"",paid:null,dwell:null,selectedChapter:null};else if(r.phase==="READY"&&(magic.phase==="READY"||magic.phase==="CLEAN"))magic={phase:"READY",force:"",paid:null,dwell:null,selectedChapter:null};sessionStorage.setItem(REMOTE_KEY,String(rev));save();return true}async function pullRemoteState(){try{const r=await fetch('/api/state',{cache:'no-store'});if(r.ok)return applyRemoteState(await r.json())}catch(e){}return false}const esc=s=>String(s).replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'\"':"&quot;"}[c]));function roman(n){const v=[[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];let r='';for(const [x,c] of v)while(n>=x){r+=c;n-=x}return r}const AUTH_TOC={"aam":["Chapter I — In Which a House Is Built at Pooh Corner for Eeyore","Chapter II — In Which Tigger Comes to the Forest and Has Breakfast","Chapter III — In Which a Search Is Organdized, and Piglet Nearly Meets the Heffalump Again","Chapter IV — In Which It Is Shown That Tiggers Don’t Climb Trees","Chapter V — In Which Rabbit Has a Busy Day, and We Learn What Christopher Robin Does in the Mornings","Chapter VI — In Which Pooh Invents a New Game and Eeyore Joins In","Chapter VII — In Which Tigger Is Unbounced","Chapter VIII — In Which Piglet Does a Very Grand Thing","Chapter IX — In Which Eeyore Finds the Wolery and Owl Moves Into It","Chapter X — In Which Christopher Robin and Pooh Come to an Enchanted Place, and We Leave Them There"],"jt":["Preface to a Life","The Night the Bed Fell","The Car We Had to Push","The book.id,a=AUTH_TOC[id],t=String(c.title||"").trim();if(a&&a[i]&&!['jeeves','huck','farewell','ac'].includes(id))return a[i];if(['jeeves','huck','farewell','ac'].includes(id)){const ps=c.pages&&c.pages[0]&&c.pages[0].paragraphs||[],q=ps.find(x=>{x=String(x).trim();return x.length>15&&!/^CHAPTER\b/i.test(x)});let w=String(q||'').trim().split(/(?<=[.!?])\s|[;:]/)[0];if(w.length>54)w=w.slice(0,54).replace(/\s+\S*$/,'')+'…';return 'Chapter '+(i+1)+(w?' — '+w.replace(/[.!?]+$/,''):'')}return t||("Chapter "+(i+1))}function displayParas(paras){const out=paras.slice(),id=state.book&&state.book.id;if(state.pi===0&&['jeeves','huck','farewell','ac'].includes(id)){const h='CHAPTER '+roman(state.ci+1);if(out[0]&&/^CHAPTER\b/i.test(out[0]))out[0]=h;else out.unshift(h);return out}if(state.pi===0&&['aam','jt'].includes(id)&&out[0]&&/^CHAPTER\b/i.test(out[0]))out[0]='CHAPTER '+roman(state.ci+1);return out}function meta(id){return META.find(x=>x.id===id)}
async function load(id){if(cache.has(id))return cache.get(id);const m=meta(id),raw=await(await fetch(m.file,{cache:'no-store'})).json();let b;if(m.legacy)b={id:m.id,title:m.title,author:m.author,chapters:raw.chapters};else{const groups=[];let current={title:'Book',pages:[]};raw.pages.forEach(p=>{let ch=p.paragraphs.find(x=>/^CHAPTER\b|^COLLECTION\b|^(TELEMACHUS|NESTOR|PROTEUS|CALYPSO|LOTUS|HADES|AEOLUS|LESTRYGONIANS|SCYLLA|WANDERING|SIRENS|CYCLOPS|NAUSICAA|OXEN|CIRCE|EUMAEUS|ITHACA|PENELOPE)/i.test(x));if(!ch&&(m.id==='dp'||m.id==='dr'))ch=p.paragraphs.find(x=>{x=String(x).trim();return x.length>1&&x.length<70&&x===x.toUpperCase()&&/[A-Z]/.test(x)&&!/^(L[’']ENVOI|THE END|CONTENTS?)$/.test(x)});if(ch&&current.pages.length){groups.push(current);current={title:ch,pages:[]}}current.pages.push({paragraphs:p.paragraphs,force_paragraphs:p.force_paragraphs})});if(current.pages.length)groups.push(current);b={id:m.id,title:m.title,author:m.author,chapters:groups}}cache.set(id,b);return b}function key(){return state.book?state.book.id+':'+state.ci+':'+state.pi:''}function current(){return state.book.chapters[state.ci].pages[state.pi]}function inject(s){return magic.force?String(s).split('$$$').join(magic.force):s}function visible(p){const k=key(),protectedOpener=state.pi===0&&magic.selectedChapter&&magic.selectedChapter.book===state.book.id&&magic.selectedChapter.ci===state.ci,forceHere=!protectedOpener&&(magic.phase==='ARMED'||(magic.phase==='PAID'&&magic.paid===k));return(forceHere&&p.force_paragraphs?p.force_paragraphs:p.paragraphs).map(x=>forceHere?inject(x):x)}function dwell(){clearTimeout(magic._timer);if(magic.phase!=='ARMED')return;const p=current(),k=key(),prot=state.pi===0&&magic.selectedChapter&&magic.selectedChapter.book===state.book.id&&magic.selectedChapter.ci===state.ci;if(!p.force_paragraphs||prot)return;magic.dwell={key:k,qualified:false};magic._timer=setTimeout(()=>{if(magic.phase==='ARMED'&&key()===k&&magic.dwell?.key===k){magic.dwell.qualified=true;save()}},6000)}function depart(){const k=key();if(magic.phase==='ARMED'&&magic.dwell?.qualified&&magic.dwell.key===k){magic.phase='PAID';magic.paid=k;magic.dwell=null;save()}}
function motion(change,dir=1,after){const a=document.getElementById('app'),old=a.firstElementChild;if(!old){change();render();if(after)after();return}old.classList.add(dir>0?'slideoutL':'slideoutR');setTimeout(()=>{change();render();const fresh=a.firstElementChild;if(fresh)fresh.classList.add(dir>0?'slideinR':'slideinL');if(after)after()},220)}function home(){state.screen='home';state.book=null;state.ci=0;state.pi=0;render();requestAnimationFrame(()=>scrollTo(0,state.homeScroll||0))}function gatewayChoice(){state.screen='home';state.homeScroll=0;render();scrollTo(0,0)}async function openBook(id){state.homeScroll=scrollY;state.book=await load(id);state.screen='cover';state.ci=0;state.pi=0;render();scrollTo(0,0)}function openContents(){motion(()=>{state.screen='contents';state.contentsScroll=0},1)}function openChapter(i){state.contentsScroll=scrollY;motion(()=>{state.ci=i;state.pi=0;if(magic.phase==='ARMED')magic.selectedChapter={book:state.book.id,ci:i};save();state.screen='reader'},1,dwell)}function backToContents(){motion(()=>state.screen='contents',-1,()=>requestAnimationFrame(()=>scrollTo(0,state.contentsScroll||0)))}function advance(d){depart();let n=state.pi+d;if(n<0){if(state.ci>0){state.ci--;state.pi=state.book.chapters[state.ci].pages.length-1}}else if(n>=state.book.chapters[state.ci].pages.length){if(state.ci<state.book.chapters.length-1){state.ci++;state.pi=0}}else state.pi=n}function turn(d){motion(()=>advance(d),d,dwell)}
let drag=null;function bindSwipe(){const r=document.querySelector('.reader'),p=document.querySelector('.page');if(!r||!p)return;r.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;const t=e.touches[0];drag={x:t.clientX,y:t.clientY,lastX:t.clientX,lastT:performance.now(),vx:0,horizontal:null};p.style.transition='none'},{passive:true});r.addEventListener('touchmove',e=>{if(!drag||e.touches.length!==1)return;const t=e.touches[0],dx=t.clientX-drag.x,dy=t.clientY-drag.y,now=performance.now();if(drag.horizontal===null&&Math.max(Math.abs(dx),Math.abs(dy))>8)drag.horizontal=Math.abs(dx)>Math.abs(dy)*1.15;if(!drag.horizontal)return;e.preventDefault();const dt=Math.max(1,now-drag.lastT);drag.vx=(t.clientX-drag.lastX)/dt;drag.lastX=t.clientX;drag.lastT=now;p.style.transform=`translate3d(${dx}px,0,0)`},{passive:false});r.addEventListener('touchend',e=>{if(!drag)return;const dx=(e.changedTouches[0]?.clientX||drag.lastX)-drag.x,w=r.clientWidth,go=drag.horizontal&&(Math.abs(dx)>w*.22||Math.abs(drag.vx)>.45);if(go){const d=dx<0?1:-1;p.style.transition='transform .16s ease-out';p.style.transform=`translate3d(${dx<0?-w:w}px,0,0)`;setTimeout(()=>{advance(d);render();const np=document.querySelector('.page');if(np){np.style.transform=`translate3d(${d>0?w:-w}px,0,0)`;np.style.transition='none';requestAnimationFrame(()=>requestAnimationFrame(()=>{np.style.transition='transform .18s ease-out';np.style.transform='translate3d(0,0,0)'}))}dwell()},160)}else{p.style.transition='transform .18s ease-out';p.style.transform='translate3d(0,0,0)'}drag=null},{passive:true})}
function render(){const a=document.getElementById('app');if(state.screen==='gateway'){a.innerHTML='<div class="artpage gateway-art"><img class="base" src="Pre-Page.jpg"><button class="hot" onclick="gatewayChoice()" aria-label="Browse books"></button></div>';return}if(state.screen==='home'){a.innerHTML='<div class="artpage landing-art"><img class="base" src="LANDING%20PAGE.jpg"><div class="carousel-window"><div class="carousel-track"><img src="Carousel.jpg"><div class="carousel-links">'+DISPLAY.map(id=>'<button onclick="openBook(\''+id+'\')"></button>').join('')+'</div></div></div><img class="suggestions-overlay" src="Suggestions.png"><span class="buildstamp">0.35</span></div>';return}if(state.screen==='cover'){a.innerHTML='<div class="coverstage"><button class="coverback" onclick="home()">‹</button><img src="'+BIG_COVERS[state.book.id]+'" onclick="openContents()"></div>';return}if(state.screen==='contents'){a.innerHTML='<div class="contents-wrap"><div class="top"><button onclick="home()">‹</button><b>'+esc(state.book.title)+'</b></div><div class="contents"><h1>Contents</h1>'+state.book.chapters.map((c,i)=>'<button class="chapter" onclick="openChapter('+i+')">'+esc(tocTitle(c,i))+'</button>').join('')+'</div></div>';return}const paras=displayParas(visible(current()));a.innerHTML='<div class="reader-wrap"><div class="top"><button onclick="backToContents()">☰</button><b>'+esc(state.book.title)+'</b></div><div class="reader"><div class="page">'+paras.map(x=>'<p>'+esc(x)+'</p>').join('')+'</div><div class="hit left" onclick="turn(-1)"></div><div class="hit right" onclick="turn(1)"></div><div class="pageno">'+(state.pi+1)+'</div></div></div>';bindSwipe()}pullRemoteState().finally(render);setInterval(pullRemoteState,2500);</script></body></html>
