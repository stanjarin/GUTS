name: Branch-only hardening QA
on:
  push:
    branches: [contents-repair]
    paths: ['.github/workflows/hardening_qa.yml']
permissions:
  contents: write
jobs:
  qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: contents-repair}
      - name: Validate hardened Reader and corpus
        run: |
          python3 - <<'PY'
          import json,re,pathlib,hashlib,subprocess
          out=['# GUTS HARDENING QA — 27 SEPTEMBER 2026','']
          root=pathlib.Path('.')
          a=(root/'index.html').read_text()
          b=(root/'public/index.html').read_text()
          assert a==b, 'root/public index mismatch'
          out.append('- root/public index.html: IDENTICAL')

          assert "split('$$$').join(magic.force)" in a, 'exact $$$ replacement missing'
          assert "split('$$').join(magic.force)" not in a, 'old $$ replacement still present'
          out.append('- exact $$$ substitution: PASS')

          m=re.search(r'const AUTH_TOC=(\{.*?\});function tocTitle',a,re.S)
          toc=json.loads(m.group(1))
          assert len(toc['jt'])==10, f"Thurber TOC count {len(toc['jt'])}"
          assert 'A Note at the End' not in toc['jt'], 'stale Thurber terminal label remains'
          assert toc['ac']==['Chapter 5','Chapter 6','Chapter 11','Chapter 12','Chapter 22','Chapter 23','Chapter 24','Chapter 25','Chapter 26','Chapter 30','Chapter 32'], toc['ac']
          assert len(toc['farewell'])==34 and toc['farewell'][0]=='Chapter 2' and toc['farewell'][-1]=='Chapter 41', toc['farewell']
          out.append('- Thurber/Christie/Farewell authoritative Contents: PASS')

          dp=re.search(r"function displayParas\(paras\)\{.*?return out\}",a,re.S).group(0)
          assert "'ac'" not in dp, 'Christie still sequentially Roman-rewritten'
          out.append('- Christie first-page source numbering preserved: PASS')

          perf=['aam','ac','dr','farewell','huck','jeeves','jj','jt']
          expected={'aam':10,'ac':11,'dr':47,'farewell':34,'huck':42,'jeeves':23,'jj':18,'jt':10}
          for bid in perf:
              p=root/'PERFORMANCE35'/f'{bid}_035.json'
              q=root/'public'/'PERFORMANCE35'/f'{bid}_035.json'
              assert p.read_bytes()==q.read_bytes(), f'{bid} root/public mismatch'
              d=json.load(open(p))
              assert len(d['chapters'])==expected[bid], f'{bid} chapter count changed'
              pages=[pg for c in d['chapters'] for pg in c['pages']]
              bad=[i for i,pg in enumerate(pages,1) if '\n'.join(map(str,pg.get('force_paragraphs',[]))).count('$$$')!=1]
              genuine=[i for i,pg in enumerate(pages,1) if '$$$' in '\n'.join(map(str,pg.get('paragraphs',[])))]
              assert not bad, f'{bid} bad force socket pages {bad[:5]}'
              assert not genuine, f'{bid} genuine marker pages {genuine[:5]}'
              out.append(f'- {bid}: chapters={len(d["chapters"])} pages={len(pages)} sockets=PASS root/public=PASS')

          ac=json.load(open(root/'PERFORMANCE35/ac_035.json'))
          act=[int(re.match(r'Chapter\\s+(\\d+)',c['title']).group(1)) for c in ac['chapters']]
          assert act==[5,6,11,12,22,23,24,25,26,30,32], act
          out.append('- Christie retained source chapter identities: PASS')

          fa=json.load(open(root/'PERFORMANCE35/farewell_035.json'))
          ft=[c['title'] for c in fa['chapters']]
          assert ft[:4]==['Chapter 2','Chapter 3','Chapter 4','Chapter 5'], ft[:4]
          assert 'Chapter 1' not in ft and 'Chapter 8' not in ft and 'Chapter 17' not in ft and 'Chapter 22' not in ft and 'Chapter 26' not in ft and 'Chapter 32' not in ft and 'Chapter 39' not in ft
          out.append('- Farewell retained source chapter identities/gaps: PASS')

          active={p.name for p in (root/'.github/workflows').glob('*.yml')}
          for stale in ['contents_fix_v2.yml','one_shot_contents_words.yml','guts035_build.yml']:
              assert stale not in active, f'{stale} still active'
          out.append('- stale write workflows absent from active workflow directory: PASS')

          # JS syntax
          script=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',a,re.I)[0]
          t=pathlib.Path('/tmp/guts-reader.mjs');t.write_text(script)
          r=subprocess.run(['node','--check',str(t)],capture_output=True,text=True)
          assert r.returncode==0, r.stderr
          out.append('- Reader JavaScript syntax: PASS')

          out += ['', '**HARDENING QA: PASS**']
          pathlib.Path('HARDENING_QA_2026-09-27.md').write_text('\n'.join(out)+'\n')
          PY
      - name: Commit QA report
        run: |
          git config user.name 'GUTS QA'
          git config user.email 'actions@users.noreply.github.com'
          git add HARDENING_QA_2026-09-27.md
          git commit -m 'Record post-hardening QA'
          git push origin HEAD:contents-repair

# trigger corrected QA regex
