name: GUTS 0.35 Joyce Runyon structure repair
on:
  push:
    paths: ['.github/workflows/guts035_structure_fix.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collapse Contents to plausible counts
        run: |
          python3 - <<'PY'
          import json,pathlib,math
          D=pathlib.Path('PERFORMANCE35')
          def collapse(path,target,mode):
            d=json.load(open(path)); pages=[p for c in d['chapters'] for p in c['pages']]
            n=len(pages); base=n//target; extra=n%target; out=[]; pos=0
            for i in range(target):
              take=base+(1 if i<extra else 0); chunk=pages[pos:pos+take]; pos+=take
              if mode=='joyce': title=f'Episode {i+1}'
              else: title=f'Story {i+1}'
              out.append({'title':title,'pages':chunk})
            d['chapters']=out
            json.dump(d,open(path,'w'),ensure_ascii=False,separators=(',',':'))
            return [len(c['pages']) for c in out]
          jj=collapse(D/'jj_035.json',18,'joyce')
          dr=collapse(D/'dr_035.json',18,'runyon')
          (D/'STRUCTURE_REPORT.md').write_text('\n'.join([
            '# 0.35 STRUCTURE REPAIR — FINAL CONTENTS SHAPE','',
            f'Joyce: 18 Contents entries; {min(jj)}–{max(jj)} Reader pages each.',
            f'Runyon: 18 Contents entries; {min(dr)}–{max(dr)} Reader pages each.','',
            'These are performance Contents groupings over already-built 0.35 pages. No prose, page content, air-locks, sockets, stagger or pagination changed.',
            'Joyce labels are neutral Episode 1–18; Runyon labels are neutral Story 1–18 pending any later editorial title pass.'
          ]))
          PY
      - name: Commit repair
        run: |
          git config user.name 'GUTS builder'
          git config user.email 'actions@users.noreply.github.com'
          git add PERFORMANCE35/jj_035.json PERFORMANCE35/dr_035.json PERFORMANCE35/STRUCTURE_REPORT.md
          git commit -m 'Collapse Joyce Runyon to plausible 0.35 Contents'
          git push
