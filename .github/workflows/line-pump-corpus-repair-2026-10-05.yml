name: Line pump corpus repair 2026-10-05

on:
  push:
    branches:
      - line-pump-corpus-repair-2026-10-05
    paths:
      - tools/line_pump_repair.py
      - .github/workflows/line-pump-corpus-repair-2026-10-05.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: line-pump-corpus-repair-2026-10-05
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Run rendered-line repair and QA
        run: python tools/line_pump_repair.py --write --report docs/checkpoints/2026-10-05_line-pump-corpus-repair.md
      - name: Commit branch-only repair
        run: |
          git config user.name "GUTS line-pump robot"
          git config user.email "actions@users.noreply.github.com"
          git add PERFORMANCE35 PERFORMANCE10 public/PERFORMANCE35 public/PERFORMANCE10 docs/checkpoints/2026-10-05_line-pump-corpus-repair.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Apply rendered-line pump repair on safe branch"
            git push origin HEAD:line-pump-corpus-repair-2026-10-05
          fi
