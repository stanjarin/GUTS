<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TRACE — Auto Listen Test</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f4f6;color:#202124;font-family:Helvetica,Arial,sans-serif}.app{max-width:540px;margin:auto;min-height:100dvh;background:#fff}.bar{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;color:#c58b00;border-bottom:1px solid #ddd}.bar strong{color:#222;font-size:21px}.screen{padding:22px}.item{border-bottom:1px solid #ddd;padding:20px 8px;font-size:20px;cursor:pointer}.muted{color:#888;font-size:14px;margin-top:6px}.note{min-height:340px;text-align:center}.date{color:#999;font-size:13px;margin:16px 0 36px}.flag{font-size:140px;min-height:195px}.status{text-align:center;color:#666;font-size:15px;padding:16px 20px}.btn{border:0;background:#f2b92b;border-radius:12px;font:600 17px Helvetica;padding:14px 20px;color:#222}.actions{display:flex;justify-content:center;gap:10px;padding:8px 15px 30px}.hidden{display:none}.success{animation:glow .8s ease-in-out}@keyframes glow{0%{background:#fff}40%{background:#343434}100%{background:#fff}}.small{font-size:13px;color:#888;text-align:center;padding:8px 20px}
</style></head><body><div class="app" id="app"><div class="bar"><span id="back" style="cursor:pointer">‹ Notes</span><strong id="heading">Notes</strong><span>TRACE</span></div><div id="list" class="screen"><div class="item" id="new">＋ New Note<div class="muted">Tap to open; listening should start automatically</div></div><div class="item hidden" id="recent"></div></div><div id="editor" class="hidden"><div class="note"><div class="date" id="date">New Note</div><div class="flag" id="flag"></div></div><div class="status" id="status">Ready</div><div class="actions"><button class="btn" id="retry">Listen again</button></div><div class="small">If listening starts on opening New Note, no second tap is required. Flag emojis are temporary.</div></div></div><script>
const $=id=>document.getElementById(id),flags={albania:'🇦🇱',estonia:'🇪🇪',japan:'🇯🇵',canada:'🇨🇦',brazil:'🇧🇷',australia:'🇦🇺',france:'🇫🇷',india:'🇮🇳',kenya:'🇰🇪','new zealand':'🇳🇿'};let latest='',running=false;
const R=window.SpeechRecognition||window.webkitSpeechRecognition;let recognition;
if(R){recognition=new R();recognition.lang='en-AU';recognition.interimResults=false;recognition.continuous=false;recognition.maxAlternatives=3;
recognition.onstart=()=>{running=true;$('status').textContent='Listening… speak a country';};
recognition.onresult=e=>{let heard=Array.from(e.results[0]).map(x=>x.transcript.trim());let country=Object.keys(flags).find(k=>heard.some(s=>s.toLowerCase().includes(k)));if(country){latest=country;$('flag').textContent=flags[country];$('date').textContent=new Intl.DateTimeFormat('en-AU',{dateStyle:'medium',timeStyle:'short'}).format(new Date());$('status').textContent='Recognised: '+heard[0];$('app').classList.remove('success');void $('app').offsetWidth;$('app').classList.add('success');}else $('status').textContent='Heard: '+heard[0]+' — not in test list';};
recognition.onerror=e=>{$('status').textContent='Recognition error: '+e.error;};
recognition.onend=()=>{running=false;if($('status').textContent.startsWith('Listening'))$('status').textContent='No speech recognised — tap Listen again';};
}
function listen(){if(!recognition){$('status').textContent='Speech recognition unavailable';return;}try{recognition.start();$('status').textContent='Starting microphone…';}catch(e){$('status').textContent='Could not start: '+e.message;}}
$('new').onclick=()=>{$('list').classList.add('hidden');$('editor').classList.remove('hidden');$('heading').textContent='New Note';$('flag').textContent='';$('date').textContent='New Note';$('status').textContent='Opening…';listen();};
$('retry').onclick=listen;
$('back').onclick=()=>{if(running)recognition.stop();$('editor').classList.add('hidden');$('list').classList.remove('hidden');$('heading').textContent='Notes';if(latest){$('recent').classList.remove('hidden');$('recent').textContent=flags[latest]+'   '+latest.replace(/\b\w/g,c=>c.toUpperCase());}};
</script></body></html>
