name: Keys calibrated positional overlap 2026-10-07

on:
  workflow_dispatch:
  push:
    branches:
      - keys-factory-scope-2026-10-07
    paths:
      - .github/keys-positional-calibrated-trigger-2026-10-07
      - tools/keys_positional_overlap_calibrated.py
      - .github/workflows/keys-positional-calibrated-2026-10-07.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: keys-factory-scope-2026-10-07
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Run calibrated positional overlap audit
        run: python tools/keys_positional_overlap_calibrated.py
      - name: Commit report
        run: |
          git config user.name "GUTS Keys calibrated audit"
          git config user.email "actions@users.noreply.github.com"
          git add docs/checkpoints/2026-10-07_keys-positional-overlap-calibrated.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Record calibrated Keys positional overlap audit"
            git push origin HEAD:keys-factory-scope-2026-10-07
          fi
