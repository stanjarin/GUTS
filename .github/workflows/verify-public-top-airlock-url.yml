name: Verify public top-airlock phone URL
on:
  push:
    branches: [experiment-top-airlock-2026-10-10]
    paths: [.github/workflows/verify-public-top-airlock-url.yml]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify preview HTTP responses and Reader source
        run: |
          set -euo pipefail
          site='https://stanjarin.github.io/GUTS/top-airlock/'
          for n in 1 2 3 4 5 6; do
            if curl -fsSL --connect-timeout 8 --max-time 30 "$site?browse=1" -o /tmp/top.html && grep -q 'function topAirlockEdition()' /tmp/top.html
          grep -q '<base href="/GUTS/top-airlock/">' /tmp/top.html; then break; fi
            sleep 5
          done
          grep -q 'function topAirlockEdition()' /tmp/top.html
          curl -fsSL --max-time 30 "${site}LANDING_PAGE_041.png" -o /tmp/landing.png
          file /tmp/landing.png
          test $(wc -c </tmp/landing.png) -gt 10000
          curl -fsSL --max-time 30 "${site}PERFORMANCE10/ripley_performance.json" -o /tmp/ripley.json
          curl -fsSL --max-time 30 "${site}PERFORMANCE35/jeeves_035.json" -o /tmp/jeeves.json
          python3 - <<'PY'
          import json
          for n in ('ripley','jeeves'):
            d=json.load(open('/tmp/'+n+'.json'))
            assert any('$$$' in str(x) for c in d['chapters'] for p in c['pages'] for x in p.get('force_paragraphs',[]))
          print('PUBLIC_TOP_AIRLOCK_URL_PASS books_checked=2 reader=experimental',flush=True)
          PY
          echo 'VERIFIED_URL=https://stanjarin.github.io/GUTS/top-airlock/?browse=1'
