name: GUTS stable staging 2026-10-08

on:
  workflow_dispatch:
  push:
    branches:
      - factory-autopilot-2026-10-07
    paths:
      - .github/stable-staging-trigger-2026-10-08
      - .github/workflows/stable-staging-2026-10-08.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: guts-stable-staging
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: factory-autopilot-2026-10-07

      - name: Download ten finished factory artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37565443433
          pattern: factory-*
          merge-multiple: true
          path: merged

      - name: Download five recovered laggards
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37592243640
          pattern: laggard-*
          merge-multiple: true
          path: recovered

      - name: Build consolidated staging tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf stage
          cp -R public stage
          cp -R merged/public/. stage/
          cp -R recovered/public/. stage/
          # GitHub Pages serves this repository beneath /GUTS/.
          # Keep production files untouched; adapt only the staging copy.
          python - <<'PY'
          from pathlib import Path
          for p in [Path("stage/index.html"), Path("stage/project_library/books/browse/index.html")]:
              if p.exists():
                  s=p.read_text()
                  s=s.replace('<base href="/">','<base href="/GUTS/">')
                  p.write_text(s)
          PY
          touch stage/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: stage

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy stable staging
        id: deployment
        uses: actions/deploy-pages@v4
