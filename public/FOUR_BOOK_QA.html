<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>GUTS four-book QA</title>
<style>body{font-family:Georgia,serif;max-width:430px;margin:auto;padding:18px;background:#fbf8ef;color:#29261f}button{display:block;width:100%;text-align:left;padding:10px 0;border:0;border-bottom:1px dotted #aaa;background:none;font:16px Georgia;color:#2f5f86}.book{margin:0 0 28px}h1{font-size:24px}h2{font-size:20px}.page{padding:14px 0}.head{font-weight:bold;margin-bottom:12px}</style>
<h1>GUTS four-book rebuild QA</h1><div id="app">Loading…</div>
<script>
const books=[['jeeves','Right Ho, Jeeves!'],['huck','Huckleberry Finn'],['farewell','A Farewell to Arms'],['ac','The Murder at the Vicarage']];
function desc(c,i){const ps=c.pages?.[0]?.paragraphs||[];const q=ps.find(x=>String(x).trim().length>15&&!/^CHAPTER\b/i.test(String(x).trim()))||'';let w=String(q).trim().split(/(?<=[.!?])\s|[;:]/)[0];if(w.length>54)w=w.slice(0,54).replace(/\s+\S*$/,'')+'…';return 'Chapter '+(i+1)+(w?' — '+w.replace(/[.!?]+$/,''):'')}
(async()=>{let out='';for(const [id,title] of books){const d=await fetch('PERFORMANCE35/'+id+'_035.json',{cache:'no-store'}).then(r=>r.json());out+='<section class="book"><h2>'+title+' — '+d.chapters.length+' chapters</h2>'+d.chapters.map((c,i)=>'<button data-b="'+id+'" data-i="'+i+'">'+desc(c,i)+'</button>').join('')+'</section>'}document.getElementById('app').innerHTML=out;document.querySelectorAll('button').forEach(b=>b.onclick=async()=>{const id=b.dataset.b,i=+b.dataset.i,d=await fetch('PERFORMANCE35/'+id+'_035.json',{cache:'no-store'}).then(r=>r.json()),c=d.chapters[i],ps=c.pages[0].paragraphs;document.getElementById('app').innerHTML='<button onclick="location.reload()">‹ Back</button><div class="page"><div class="head">CHAPTER '+(i+1)+'</div>'+ps.map(x=>'<p>'+String(x).replace(/[&<>]/g,z=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[z]))+'</p>').join('')+'</div>'})})()
</script>
