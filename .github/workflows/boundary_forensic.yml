name: Branch-only prepared boundary scan
on:
  push:
    branches: [contents-repair]
    paths: ['.github/workflows/boundary_forensic.yml']
permissions:
  contents: write
jobs:
  scan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: contents-repair}
      - name: Scan prepared pages
        run: |
          python3 - <<'PY'
          import json,re,pathlib
          def norm(s):
              s=str(s).upper().replace('’',"'").replace('“','"').replace('”','"')
              s=re.sub(r'[^A-Z0-9]+',' ',s)
              return re.sub(r'\s+',' ',s).strip()
          text=pathlib.Path('index.html').read_text()
          toc=json.loads(re.search(r'const AUTH_TOC=(\{.*?\});function tocTitle',text,re.S).group(1))
          out=[]
          for bid in ('dr','jj'):
              d=json.load(open(f'PERFORMANCE35/{bid}_035.json'))
              pages=[p for c in d['chapters'] for p in c['pages']]
              out.append(f'## {bid.upper()} PREPARED LANDMARKS')
              for ti,title in enumerate(toc[bid],1):
                  key=norm(title); hits=[]
                  for pi,p in enumerate(pages):
                      for qi,x in enumerate(p.get('paragraphs',[])):
                          nx=norm(x)
                          # title-like exact/prefix only; avoid prose mentions
                          if nx==key or nx.startswith(key+' '):
                              hits.append((pi+1,qi+1,str(x)[:160]))
                  out.append(f'{ti:02d}. {title} :: '+(' | '.join(f'page {a} para {b}: {x}' for a,b,x in hits) if hits else 'NOT FOUND'))
              # Also catch explicit Joyce episode markers that title matching may miss.
              if bid=='jj':
                  out.append('### explicit EPISODE markers')
                  for pi,p in enumerate(pages):
                      for qi,x in enumerate(p.get('paragraphs',[])):
                          if re.search(r'\bEPISODE\s+(?:I|V|X)',str(x),re.I):
                              out.append(f'page {pi+1} para {qi+1}: {str(x)[:180]}')
              out.append('')
          pathlib.Path('PREPARED_BOUNDARY_SCAN.md').write_text('\n'.join(out))
          PY
      - name: Commit report
        run: |
          git config user.name 'GUTS forensic'
          git config user.email 'actions@users.noreply.github.com'
          git add PREPARED_BOUNDARY_SCAN.md
          git commit -m 'Map genuine landmarks in prepared Runyon Joyce pages'
          git push origin HEAD:contents-repair
