name: Branch-only rebuild feasibility
on:
  push:
    branches: [contents-repair]
    paths: ['.github/workflows/boundary_forensic.yml']
permissions:
  contents: write
jobs:
  scan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: contents-repair}
      - name: Measure genuine Runyon stories and Joyce episodes
        run: |
          python3 - <<'PY'
          import json,re,pathlib
          def norm(s):
              s=str(s).upper().replace('’',"'").replace('“','"').replace('”','"')
              s=re.sub(r'[^A-Z0-9]+',' ',s)
              return re.sub(r'\s+',' ',s).strip()
          def wc(s): return len(re.findall(r"\b[\w’'-]+\b",str(s)))
          text=pathlib.Path('index.html').read_text()
          toc=json.loads(re.search(r'const AUTH_TOC=(\{.*?\});function tocTitle',text,re.S).group(1))
          out=[]
          # Runyon: locate the 47 authoritative titles in strict order.
          d=json.load(open('PRIMED/DR_GUTS_PRIME2.json'))
          paras=[x for p in d['pages'] for x in p.get('paragraphs',[])]
          starts=[]; pos=0
          for title in toc['dr']:
              k=norm(title); hit=None
              for j in range(pos,len(paras)):
                  n=norm(paras[j])
                  if n==k or n.startswith(k+' ') or n.endswith(' '+k) or ('COLLECTION' in n and k in n):
                      hit=j; break
              if hit is None: raise SystemExit('Runyon title not found in order: '+title)
              starts.append((title,hit)); pos=hit+1
          out.append('# REBUILD FEASIBILITY\n\n## Runyon')
          for i,(title,a) in enumerate(starts):
              b=starts[i+1][1] if i+1<len(starts) else len(paras)
              words=sum(wc(x) for x in paras[a:b])
              out.append(f'{i+1:02d}. {title} — {words} words')
          # Joyce: explicit markers plus Sirens opening.
          j=json.load(open('PRIMED/JJ_GUTS_PRIME2.json'))
          jp=[x for p in j['pages'] for x in p.get('paragraphs',[])]
          specs=[
            ('Telemachus',r'EPISODE\s+I\b'),('Nestor',r'EPISODE\s+II\b'),('Proteus',r'EPISODE\s+III\b'),
            ('Calypso',r'EPISODE\s+IV\b'),('Lotus Eaters',r'EPISODE\s+V\b'),('Hades',r'EPISODE\s+VI\b'),
            ('Aeolus',r'EPISODE\s+VII\b'),('Lestrygonians',r'EPISODE\s+VIII\b'),('Scylla and Charybdis',r'EPISODE\s+IX\b'),
            ('Wandering Rocks',r'EPISODE\s+X\b'),('Sirens',r'^Bronze by gold heard the hoofirons'),('Cyclops',r'EPISODE\s+XII\b'),
            ('Nausicaa',r'EPISODE\s+XIII\b'),('Oxen of the Sun',r'EPISODE\s+XIV\b'),('Circe',r'EPISODE\s+XV\b'),
            ('Eumaeus',r'EPISODE\s+XVI\b'),('Ithaca',r'EPISODE\s+XVII\b'),('Penelope',r'EPISODE\s+XVIII\b')]
          js=[]; pos=0
          for title,pat in specs:
              hit=None
              rg=re.compile(pat,re.I)
              for q in range(pos,len(jp)):
                  if rg.search(str(jp[q]).strip()): hit=q; break
              if hit is None: raise SystemExit('Joyce start not found: '+title)
              js.append((title,hit,jp[hit][:140])); pos=hit+1
          out.append('\n## Joyce')
          for i,(title,a,opening) in enumerate(js):
              b=js[i+1][1] if i+1<len(js) else len(jp)
              words=sum(wc(x) for x in jp[a:b])
              out.append(f'{i+1:02d}. {title} — {words} words — OPEN: {opening}')
          pathlib.Path('REBUILD_FEASIBILITY.md').write_text('\n'.join(out))
          PY
      - name: Commit report
        run: |
          git config user.name 'GUTS forensic'
          git config user.email 'actions@users.noreply.github.com'
          git add REBUILD_FEASIBILITY.md
          git commit -m 'Measure genuine Runyon Joyce rebuild divisions'
          git push origin HEAD:contents-repair
