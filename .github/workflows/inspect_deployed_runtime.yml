name: Inspect deployed preview runtime
on:
  push:
    branches: [contents-repair]
    paths: ['.github/workflows/inspect_deployed_runtime.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: contents-repair}
      - name: Compare deployed and repo runtime
        run: |
          curl -fsS --max-time 20 https://contents-repair-guts.stanjarin.workers.dev/ -o /tmp/live.html
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          repo=Path('public/index.html').read_text()
          live=Path('/tmp/live.html').read_text()
          def inj(s):
              m=re.search(r'function inject\(s\)\{[^}]+\}',s)
              return m.group(0) if m else 'NOT FOUND'
          lines=[
            '# DEPLOYED RUNTIME CHECK','',
            'Repo SHA256: `'+hashlib.sha256(repo.encode()).hexdigest()+'`',
            'Live SHA256: `'+hashlib.sha256(live.encode()).hexdigest()+'`','',
            'Identical full HTML: **'+('YES' if repo==live else 'NO')+'**','',
            '## Repo inject','```js',inj(repo),'```','',
            '## Live inject','```js',inj(live),'```'
          ]
          Path('DEPLOYED_RUNTIME_CHECK_2026-09-28.md').write_text('\n'.join(lines))
          PY
      - name: Commit report
        run: |
          git config user.name 'GUTS inspector'
          git config user.email 'actions@users.noreply.github.com'
          git add DEPLOYED_RUNTIME_CHECK_2026-09-28.md
          git commit -m 'Inspect deployed preview runtime'
          git push origin HEAD:contents-repair