<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="guts-build" content="v0.23-cloudflare-pull-seam">
<title>Project Gutenberg — Books</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Helvetica,sans-serif;color:#222;background:#fff}
#app{max-width:430px;margin:auto;min-height:100vh}.head{padding:16px;border-bottom:1px solid #ddd}.brand{font:700 24px Georgia,serif}.brand small{font:400 11px Helvetica,sans-serif;display:block;letter-spacing:.08em}
.home{padding:16px}
.gateway{padding:24px 20px;font-family:Georgia,"Times New Roman",serif}
.gateway .crest{width:54px;height:54px;border:2px solid #9a7b2f;border-radius:50%;margin:4px auto 18px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#9a7b2f}
.gateway .resources{font:700 18px Helvetica,sans-serif;color:#9a7b2f;text-align:center;letter-spacing:.04em}
.gateway h1{font:700 25px/1.2 Georgia,serif;text-align:center;margin:14px 0 16px}
.gateway p{font:16px/1.45 Georgia,serif;text-align:center}
.gateway h2{font:700 17px Georgia,serif;margin:28px 0 8px}
.gateway button{display:block;width:100%;border:0;border-bottom:1px solid #ccc;background:#fff;text-align:left;padding:13px 2px;color:#0000ee;text-decoration:underline;font:16px Georgia,serif}.home h1{font:700 22px/1.2 Georgia,serif;margin:6px 0 12px}.home p{font:14px/1.45 Georgia,serif}.suggest{margin-top:24px;border-top:1px solid #ddd;padding-top:16px}.suggest h2{font-size:18px}
.book{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid #ddd;background:none;width:100%;text-align:left;border-left:0;border-right:0;border-top:0}.cover{width:56px;height:76px;background:#eee;display:flex;align-items:center;justify-content:center;text-align:center;font:700 10px/1.1 Georgia,serif;padding:5px}.bt{font:700 15px/1.2 Georgia,serif}.ba{font-size:12px;margin-top:5px;color:#666}
.top{height:48px;display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid #ddd;position:sticky;top:0;background:#fff;z-index:4}.top b{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top button{border:0;background:none;font-size:18px}
.contents{padding:12px 18px}.contents h1{font:700 24px Georgia,serif}.chapter{display:block;width:100%;text-align:left;padding:13px 2px;border:0;border-bottom:1px solid #ddd;background:#fff;font:16px Georgia,serif}
.reader{height:calc(100vh - 48px);position:relative}.page{height:100%;overflow:auto;padding:26px 22px 54px;font:19px/1.5 Georgia,serif}.page p{margin:0 0 .85em}.page .chapter{font-weight:700;border:0;padding:0;margin:0 0 1em}.pageno{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:11px;color:#777}.hit{position:absolute;top:0;bottom:40px;width:20%;z-index:3}.left{left:0}.right{right:0}
.admin{position:fixed;left:calc(50% + 145px);bottom:12px;width:72px;height:34px;z-index:10;border:1px solid #777;border-radius:5px;background:#eee;color:#222;font:700 12px/32px Helvetica,sans-serif;text-align:center;cursor:pointer}
.panel{position:fixed;left:12px;right:12px;bottom:12px;background:#eee;border:1px solid #999;padding:10px;z-index:20;display:flex;gap:6px}.panel input{min-width:0;flex:1}.panel button{padding:7px}.hidden{display:none}
</style></head><body><div id="app"></div><div class="admin" id="admin">TEST</div>
<script>
const META=[
{id:"aam",title:"The House at Pooh Corner",author:"A. A. Milne",file:"PRIMED/AAM_GUTS_PRIME2.json"},
{id:"jeeves",title:"Right Ho, Jeeves!",author:"P. G. Wodehouse",file:"https://raw.githubusercontent.com/stanjarin/NoBoNoFo/main/books/jeeves.json",legacy:true},
{id:"farewell",title:"A Farewell to Arms",author:"Ernest Hemingway",file:"https://raw.githubusercontent.com/stanjarin/NoBoNoFo/main/books/farewell.json",legacy:true},
{id:"aam2",title:"The House at Pooh Corner",author:"A. A. Milne",alias:"aam"},
{id:"huck",title:"Adventures of Huckleberry Finn",author:"Mark Twain",file:"https://raw.githubusercontent.com/stanjarin/NoBoNoFo/main/books/huck.json",legacy:true},
{id:"dp",title:"Men I’m Not Married To",author:"Dorothy Parker",file:"PRIMED/DP_GUTS_PRIME2.json"},
{id:"dr",title:"On Broadway",author:"Damon Runyon",file:"PRIMED/DR_GUTS_PRIME2.json"},
{id:"ac",title:"The Murder at the Vicarage",author:"Agatha Christie",file:"PRIMED/AC_GUTS_PRIME2.json"},
{id:"jj",title:"Ulysses",author:"James Joyce",file:"PRIMED/JJ_GUTS_PRIME2.json"},
{id:"jt",title:"My Life and Hard Times",author:"James Thurber",file:"PRIMED/JT_GUTS_PRIME2.json"}];
const DISPLAY=["jt","jeeves","farewell","aam","huck","dp","dr","ac","jj"];
let state={screen:"gateway",book:null,ci:0,pi:0};
const cache=new Map(), KEY="guts-magic-v01", REMOTE_KEY="guts-remote-revision-v01";
let magic=Object.assign({phase:"READY",force:"",paid:null,dwell:null,selectedChapter:null},JSON.parse(sessionStorage.getItem(KEY)||"{}"));
const save=()=>sessionStorage.setItem(KEY,JSON.stringify(magic));
function applyRemoteState(remote){
 if(!remote||!["READY","ARMED","CLEAN"].includes(remote.phase))return false;
 const revision=Number(remote.revision||0), seen=Number(sessionStorage.getItem(REMOTE_KEY)||0);
 if(revision<=seen)return false;
 if(remote.phase==="ARMED"&&String(remote.word||"").trim()){
   if(magic.phase!=="PAID")magic={phase:"ARMED",force:String(remote.word).trim(),paid:null,dwell:null,selectedChapter:null};
 }else if(remote.phase==="CLEAN"){
   magic={phase:"CLEAN",force:"",paid:null,dwell:null,selectedChapter:null};
 }else if(remote.phase==="READY"&&(magic.phase==="READY"||magic.phase==="CLEAN")){
   magic={phase:"READY",force:"",paid:null,dwell:null,selectedChapter:null};
 }
 sessionStorage.setItem(REMOTE_KEY,String(revision));save();return true;
}
async function pullRemoteState(){
 try{
   const r=await fetch("/api/state",{cache:"no-store",headers:{"Accept":"application/json"}});
   if(!r.ok)return false;
   return applyRemoteState(await r.json());
 }catch(e){return false}
}
function invariant(){
 const phases=["READY","ARMED","PAID","CLEAN"];
 if(!phases.includes(magic.phase))throw Error("bad phase "+magic.phase);
 if(magic.phase==="READY"&&(magic.force||magic.paid))throw Error("READY contamination");
 if(magic.phase==="ARMED"&&!magic.force)throw Error("ARMED without force");
 if(magic.phase==="PAID"&&(!magic.force||!magic.paid))throw Error("PAID incomplete");
 if(magic.phase==="CLEAN"&&magic.force)throw Error("CLEAN retains force");
 return true;
}
function torture(){
 const old=JSON.parse(JSON.stringify(magic)); const report=[];
 try{
   magic={phase:"READY",force:"",paid:null,dwell:null,selectedChapter:null}; report.push(["READY",invariant()]);
   magic={phase:"ARMED",force:"Gophers",paid:null,dwell:null,selectedChapter:null}; report.push(["ARMED",invariant()]);
   magic.dwell={key:"test:0:1",qualified:true}; magic.phase="PAID";magic.paid="test:0:1"; report.push(["PAID",invariant()]);
   magic.phase="CLEAN";magic.force=""; report.push(["CLEAN",invariant()]);
   magic={phase:"READY",force:"",paid:null,dwell:null,selectedChapter:null}; report.push(["RESET",invariant()]);
   return {ok:true,report};
 }catch(e){return {ok:false,error:String(e),report}}
 finally{magic=old;save()}
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function meta(id){return META.find(x=>x.id===id)}
async function load(id){
 if(cache.has(id))return cache.get(id); const m=meta(id); let raw=await (await fetch(m.file,{cache:"no-store"})).json(), b;
 if(m.legacy){b={id:m.id,title:m.title,author:m.author,chapters:raw.chapters}}
 else{
   const groups=[]; let current={title:"Book",pages:[]};
   raw.pages.forEach(p=>{const ch=p.paragraphs.find(x=>/^CHAPTER\b|^COLLECTION\b|^(TELEMACHUS|NESTOR|PROTEUS|CALYPSO|LOTUS|HADES|AEOLUS|LESTRYGONIANS|SCYLLA|WANDERING|SIRENS|CYCLOPS|NAUSICAA|OXEN|CIRCE|EUMAEUS|ITHACA|PENELOPE)/i.test(x));if(ch&&current.pages.length){groups.push(current);current={title:ch,pages:[]}};current.pages.push({paragraphs:p.paragraphs,force_paragraphs:p.force_paragraphs})});if(current.pages.length)groups.push(current);
   b={id:m.id,title:m.title,author:m.author,chapters:groups};
 }
 cache.set(id,b);return b;
}
function key(){return state.book?state.book.id+":"+state.ci+":"+state.pi:""}
function current(){return state.book.chapters[state.ci].pages[state.pi]}
function inject(s){return magic.force?String(s).split("$$").join(magic.force):s}
function visible(p){const k=key();const protectedOpener=state.pi===0&&magic.selectedChapter&&magic.selectedChapter.book===state.book.id&&magic.selectedChapter.ci===state.ci;const forceHere=!protectedOpener&&(magic.phase==="ARMED"||(magic.phase==="PAID"&&magic.paid===k));return (forceHere&&p.force_paragraphs?p.force_paragraphs:p.paragraphs).map(x=>forceHere?inject(x):x)}
function dwell(){clearTimeout(magic._timer);if(magic.phase!=="ARMED")return;const p=current(),k=key();const protectedOpener=state.pi===0&&magic.selectedChapter&&magic.selectedChapter.book===state.book.id&&magic.selectedChapter.ci===state.ci;if(!p.force_paragraphs||protectedOpener)return;magic.dwell={key:k,qualified:false};magic._timer=setTimeout(()=>{if(magic.phase==="ARMED"&&key()===k&&magic.dwell?.key===k){magic.dwell.qualified=true;save()}},6000)}
function depart(){const k=key();if(magic.phase==="ARMED"&&magic.dwell?.qualified&&magic.dwell.key===k){magic.phase="PAID";magic.paid=k;magic.dwell=null;save()}}
function home(){state={screen:"home",book:null,ci:0,pi:0};render()}\nfunction gatewayChoice(){state.screen="home";render()}
async function openBook(id){state.book=await load(id);state.screen="contents";state.ci=0;state.pi=0;render()}
function openChapter(i){state.ci=i;state.pi=0;if(magic.phase==="ARMED")magic.selectedChapter={book:state.book.id,ci:i};save();state.screen="reader";render();dwell()}
function turn(d){depart();let n=state.pi+d;if(n<0){if(state.ci>0){state.ci--;state.pi=state.book.chapters[state.ci].pages.length-1}}else if(n>=state.book.chapters[state.ci].pages.length){if(state.ci<state.book.chapters.length-1){state.ci++;state.pi=0}}else state.pi=n;render();dwell()}
function render(){
 const a=document.getElementById("app");
 if(state.screen==="gateway"){a.innerHTML='<div class="gateway"><div class="crest">✦</div><div class="resources">Resources</div><h1>From Project Gutenberg,<br>free books in the public domain</h1><p>The world’s great literature available<br>to everyone at no cost or subscription.</p><h2>Make a start here:</h2><button onclick="gatewayChoice()">Recent additions</button><button onclick="gatewayChoice()">Popular titles</button><button onclick="gatewayChoice()">Reader recommendations</button><button onclick="gatewayChoice()">Staff picks</button></div>';return}
 if(state.screen==="home"){a.innerHTML='<div class="head"><div class="brand">Project Gutenberg<small>FREE eBOOKS</small></div></div><div class="home"><h1>Books from Project Gutenberg, a library of over 78,000 free eBooks</h1><p>Choose among free epub and Kindle eBooks, download them or read them online.</p><div class="suggest"><h2>Our suggestions</h2>'+DISPLAY.map(id=>{const m=meta(id);return '<button class="book" onclick="openBook(\''+id+'\')"><span class="cover">'+esc(m.author.split(" ").pop())+'</span><span><span class="bt">'+esc(m.title)+'</span><span class="ba">'+esc(m.author)+'</span></span></button>'}).join("")+'</div></div>';return}
 if(state.screen==="contents"){a.innerHTML='<div class="top"><button onclick="home()">‹</button><b>'+esc(state.book.title)+'</b></div><div class="contents"><h1>Contents</h1>'+state.book.chapters.map((c,i)=>'<button class="chapter" onclick="openChapter('+i+')">'+esc(c.title||("Chapter "+(i+1)))+'</button>').join("")+'</div>';return}
 const p=current(), ps=visible(p);
  if(ps.some(x=>String(x).includes("$$"))){
    a.innerHTML='<div class="reader"><h2>GUTS DIAGNOSTIC</h2><p>phase: '+esc(magic.phase)+'</p><p>force: '+esc(JSON.stringify(magic.force))+'</p><p>revision: '+esc(sessionStorage.getItem(REMOTE_KEY)||"none")+'</p><p>page: '+esc(key())+'</p><p>has force_paragraphs: '+esc(String(!!p.force_paragraphs))+'</p></div>';return;
  }
  a.innerHTML='<div class="top"><button onclick="state.screen=\'contents\';render()">‹</button><b>'+esc(state.book.title)+'</b></div><div class="reader"><div class="hit left" onclick="turn(-1)"></div><div class="hit right" onclick="turn(1)"></div><div class="page">'+ps.map((x,i)=>'<p'+(i===0&&/^CHAPTER\b|^COLLECTION\b/i.test(x)?' class="chapter"':'')+'>'+esc(x)+'</p>').join("")+'</div><div class="pageno">'+(state.pi+1)+'</div></div>';
}
document.getElementById("admin").onclick=()=>showAdmin();
function showAdmin(){let p=document.getElementById("panel");if(p){p.remove();return}p=document.createElement("div");p.id="panel";p.className="panel";p.innerHTML='<input id="force" placeholder="force word"><button id="arm">ARM</button><button id="clean">CLEAN</button><button id="reset">RESET</button><button id="test">TEST</button>';document.body.appendChild(p);document.getElementById("force").value=magic.force;document.getElementById("arm").onclick=()=>{let w=document.getElementById("force").value.trim();if(w){magic={phase:"ARMED",force:w,paid:null,dwell:null,selectedChapter:null};save();p.remove()}};document.getElementById("clean").onclick=()=>{if(magic.phase==="PAID"){magic.phase="CLEAN";magic.force="";save();render()}p.remove()};document.getElementById("reset").onclick=()=>{magic={phase:"READY",force:"",paid:null,dwell:null,selectedChapter:null};save();home();p.remove()};document.getElementById("test").onclick=()=>alert(JSON.stringify(torture(),null,2))}
render();
pullRemoteState().then(changed=>{if(changed)render()});
</script></body></html>
