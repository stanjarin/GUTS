const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim();

function noteRow(title,preview,img,action){const row=document.createElement('div');row.className='note-entry';const copy=document.createElement('div');copy.className='note-copy';const t=document.createElement('div');t.className='note-title';t.textContent=title;const p=document.createElement('div');p.className='note-preview';p.textContent=preview;const folder=document.createElement('div');folder.className='note-folder';folder.innerHTML=folderSVG+'<span>Notes</span>';copy.append(t,p,folder);row.append(copy);if(img){const thumb=document.createElement('img');thumb.className='note-thumb';thumb.src=img;thumb.alt='';row.append(thumb);}if(action)row.onclick=action;return row;}
function showList(){if(listening&&rec){try{rec.stop()}catch(e){}}$('editor').classList.add('hidden');$('list').classList.remove('hidden');$('app').classList.remove('editor-open');$('heading').textContent='Notes';$('back').textContent='‹ Folders';$('back').style.visibility='visible';$('newTop').textContent='•••';const entries=$('entries');entries.innerHTML='';function group(label,rows){const h=document.createElement('h2');h.className='section-heading';h.textContent=label;entries.append(h);const g=document.createElement('div');g.className='note-group';rows.forEach(r=>g.append(r));entries.append(g);}const today=notes.map(n=>noteRow('New Note',n.date.toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'})+'  1 photo',FLAGS[n.country],()=>openExisting(n)));today.push(noteRow('Optus','10:45 am  Paid',null,null));group('Today',today);for(const sec of bogus)group(sec.section,sec.items.map(([title,preview])=>noteRow(title,preview,null,null)));$('noteCount').textContent=(46+notes.length)+' Notes';}
function showEditor(){ $('app').classList.add('editor-open');$('back').textContent='‹ Notes';$('newTop').innerHTML="<svg width=\"27\" height=\"27\" viewBox=\"0 0 28 28\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16.5 4.5H6.5A2.5 2.5 0 0 0 4 7v14.5A2.5 2.5 0 0 0 6.5 24h14a2.5 2.5 0 0 0 2.5-2.5v-10\"/><path d=\"M12 18l3.5-.7L25 7.8a2.1 2.1 0 0 0-3-3L12.5 14.3 12 18z\"/></svg>";$('list').classList.add('hidden');$('editor').classList.remove('hidden');$('heading').textContent='New Note';$('back').style.visibility='visible';}
function newNote(){active=null;noteStartedAt=new Date(Date.now()+60000);showEditor();$('date').textContent=noteStartedAt.toLocaleString('en-AU',{dateStyle:'medium',timeStyle:'short'});$('art').classList.add('hidden');$('status').textContent='Starting microphone…';listen();}
function openExisting(n){active=n;showEditor();$('date').textContent=n.date.toLocaleString('en-AU',{dateStyle:'medium',timeStyle:'short'});$('art').src=FLAGS[n.country];$('art').classList.remove('hidden');$('status').textContent='';}
function listen(){if(!R){$('status').textContent='Speech recognition unavailable in this browser';return;}if(listening){$('status').textContent='Already listening';return;}rec=new R();rec.lang='en-AU';rec.interimResults=false;rec.continuous=false;rec.maxAlternatives=5;rec.onstart=()=>{listening=true;$('status').textContent='Listening…';};rec.onspeechstart=()=>{$('status').textContent='Heard';};rec.onresult=e=>{const phrases=Array.from(e.results[0]).map(x=>x.transcript);const country=matchCountry(phrases);if(!country){$('status').textContent='Not recognised: '+phrases[0];return;}try{rec.stop()}catch(e){}const n={country,date:noteStartedAt||new Date(Date.now()+60000)};notes.unshift(n);active=n;$('art').onload=()=>{$('paper').classList.remove('cue');void $('paper').offsetWidth;$('paper').classList.add('cue');};$('art').src=FLAGS[country];$('art').classList.remove('hidden');$('date').textContent=n.date.toLocaleString('en-AU',{dateStyle:'medium',timeStyle:'short'});$('status').textContent='Heard';};rec.onerror=e=>{$('status').textContent='Recognition: '+e.error;};rec.onend=()=>{listening=false;if($('status').textContent==='Listening…')$('status').textContent='No speech heard';};try{rec.start()}catch(e){$('status').textContent=e.message;}}
