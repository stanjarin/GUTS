name: Line pump boundary-law QA 2026-10-05

on:
  push:
    branches:
      - line-pump-boundary-law-2026-10-05
    paths:
      - .github/line-pump-boundary-run-trigger-2026-10-05

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: line-pump-boundary-law-2026-10-05
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile tools/line_pump_boundary_repair.py
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Run boundary-law repair and QA
        id: qa
        continue-on-error: true
        run: python tools/line_pump_boundary_repair.py --write --report docs/checkpoints/2026-10-05_line-pump-boundary-law.md
      - name: Commit QA result on safe branch
        run: |
          git config user.name "GUTS boundary-law robot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/checkpoints/2026-10-05_line-pump-boundary-law.md
          if [ "${{ steps.qa.outcome }}" = "success" ]; then
            git add PERFORMANCE35 PERFORMANCE10 public/PERFORMANCE35 public/PERFORMANCE10
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Record boundary-law line-pump QA"
            git push origin HEAD:line-pump-boundary-law-2026-10-05
          fi
      - name: Enforce QA gate
        if: steps.qa.outcome != 'success'
        run: |
          echo "Boundary-law QA HOLD; report committed, corpus not committed."
          exit 1
