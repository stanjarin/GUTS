name: Keys targeted retention repair 2026-10-07

on:
  push:
    branches:
      - keys-factory-scope-2026-10-07
    paths:
      - .github/keys-retention-target-trigger-2026-10-07

permissions:
  contents: write

concurrency:
  group: keys-retention-target-repair-2026-10-07
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: keys-factory-scope-2026-10-07
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Run targeted retention repair
        id: repair
        continue-on-error: true
        run: python tools/keys_retention_target_repair.py
      - name: Commit report and candidate on PASS
        if: always()
        run: |
          git config user.name "GUTS Keys retention robot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/checkpoints/2026-10-07_keys-retention-target-repair.md
          if [ "${{ steps.repair.outcome }}" = "success" ]; then
            git add PERFORMANCE10/keys_performance.json public/PERFORMANCE10/keys_performance.json
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Record Keys targeted retention repair"
            git pull --rebase origin keys-factory-scope-2026-10-07
            git push origin HEAD:keys-factory-scope-2026-10-07
          fi
      - name: Enforce repair gate
        if: steps.repair.outcome != 'success'
        run: exit 1
