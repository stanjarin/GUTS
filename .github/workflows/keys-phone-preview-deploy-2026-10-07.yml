name: Keys phone preview deploy 2026-10-07

on:
  push:
    branches:
      - keys-factory-scope-2026-10-07
    paths:
      - .github/keys-phone-preview-trigger-2026-10-07
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: keys-factory-scope-2026-10-07
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Wrangler
        run: npm install --no-save wrangler@4.148.0
      - name: Deploy anonymous temporary visual preview
        run: npx wrangler deploy --config wrangler.keys-preview.jsonc --temporary
