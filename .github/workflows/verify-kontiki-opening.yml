name: Verify Kon-Tiki opening cleanup
on:
  push:
    branches: [experiment-top-airlock-2026-10-10]
    paths: [.github/workflows/verify-kontiki-opening.yml]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install playwright
          python -m playwright install chromium
      - name: Inspect every Kon-Tiki chapter opener
        run: |
          mkdir -p /tmp/site/GUTS/top-airlock
          cp -a public/. /tmp/site/GUTS/top-airlock/
          python3 -m http.server 8765 --directory /tmp/site >/tmp/http.log 2>&1 &
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
            browser=pw.chromium.launch();p=browser.new_page(viewport={'width':375,'height':667})
            p.goto('http://127.0.0.1:8765/GUTS/top-airlock/?browse=1')
            data=p.evaluate("""async()=>{
              const b=await load('kontiki'),report=[];
              for(let ci=0;ci<b.chapters.length;ci++){
                state.book=b;state.ci=ci;state.pi=0;
                const out=topAirlockEdition(),ix=out.findIndex(x=>String(x).includes('$$$'));
                report.push({ch:ci+1,ix,first:out.slice(0,4).map(x=>String(x).slice(0,110)),old:b.chapters[ci].pages[0].paragraphs.slice(0,2).map(x=>String(x).slice(0,110))})
              }return report
            }""")
            for d in data: print('CHAPTER',d,flush=True)
            assert len(data)>=7
            assert all(d['ix']==1 for d in data)
            assert data[6]['first'][2].startswith('On the night'),data[6]
            assert all(not (len(d['first'])>1 and '—' in d['first'][1] and len(d['first'][1])>150) for d in data)
            print('KONTIKI_OPENINGS_PASS chapters='+str(len(data)),flush=True)
            browser.close()
          PY
