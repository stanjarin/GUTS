<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="guts-build" content="v0.33-poet-editorial"><title>Project Gutenberg — Books</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Helvetica,sans-serif;color:#222;background:#fff;overscroll-behavior-y:none}body{overflow-x:hidden}#app{max-width:430px;margin:auto;min-height:100vh;overflow:hidden;background:#fff}.artpage{position:relative;width:100%;overflow:hidden;background:#fff}.artpage>.base{display:block;width:100%;height:auto}.gateway-art .hot{position:absolute;left:3%;right:3%;height:6%;border:0;background:transparent;padding:0;cursor:pointer;z-index:10;touch-action:manipulation}.gateway-art .h1{top:33.8%}.gateway-art .h2{top:39.0%}.gateway-art .h3{top:44.2%}.gateway-art .h4{top:53.5%;height:8%}.landing-art{overflow:hidden}.buildstamp{position:absolute;right:9px;bottom:7px;z-index:5;font:10px/1 Helvetica,sans-serif;color:#777;pointer-events:none}.carousel-window{position:absolute;left:5.5%;right:5.5%;top:30.5%;height:18.2%;overflow-x:auto;overflow-y:hidden;border-radius:0 0 14px 14px;-webkit-overflow-scrolling:touch;scrollbar-width:none;touch-action:pan-x;background:#fff}.carousel-window::-webkit-scrollbar{display:none}.carousel-track{position:relative;height:100%;width:max-content}.carousel-track img{display:block;height:100%;width:auto;max-width:none;-webkit-user-drag:none;user-select:none}.carousel-links{position:absolute;inset:0;display:grid;grid-template-columns:repeat(9,1fr)}.carousel-links button{border:0;background:transparent;padding:0}.suggestions-overlay{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;z-index:3;transform:translateY(4px)}.carousel-mask{position:absolute;left:5.5%;right:5.5%;top:46.6%;height:2.35%;background:#fff;z-index:2;pointer-events:none}.top{height:44px;display:flex;align-items:center;gap:8px;padding:6px 10px;b ames inL{from{transform:translate3d(-100%,0,0)}to{transform:translate3d(0,0,0)}}.contents-wrap{background:#f7f3e8}.contents{padding:26px 22px 52px;background:#f7f3e8;color:#26231d;min-height:calc(100vh - 44px)}.contents h1{font:small-caps 29px/1.1 Georgia,serif;letter-spacing:.035em;text-align:center;margin:8px 0 22px;padding:0 0 13px;border-bottom:1px solid #9c927d}.chapter{position:relative;padding:13px 30px 13px 4px;border:0;border-bottom:1px dotted #b8ae99;background:transparent;font:17px/1.3 Georgia,serif;color:#2f5f86;text-decoration:none}.chapter:after{content:'›';position:absolute;right:6px;top:10px;color:#857b69;font:22px Georgia,serif}.reader-wrap,.reader,.page{background:#fbf8ef}.top{background:#f3efe4;border-bottom:1px solid #b8ae99;color:#363126}.top b{font-family:Georgia,serif;font-weight:normal;font-size:14px}.top button{color:#315f83}.page{padding:28px 25px 62px;font:18.5px/1.55 Georgia,serif;color:#29261f}.page p{margin:0 0 .92em}.page p:first-child{margin-top:2px}.pageno{bottom:11px;font:11px Georgia,serif;color:#827968}</style></head><body><div id="app"></div><script>
const META=[{id:"aam",title:"The House at Pooh Corner",author:"A. A. Milne",file:"PRIMED/AAM_GUTS_PRIME2.json"},{id:"jeeves",title:"Right Ho, Jeeves!",author:"P. G. Wodehouse",file:"https://raw.githubusercontent.com/stanjarin/NoBoNoFo/main/books/jeeves.json",legacy:true},{id:"farewell",title:"A Farewell to Arms",author:"Ernest Hemingway",file:"https://raw.githubusercontent.com/stanjarin/NoBoNoFo/main/books/farewell.json",legacy:true},{id:"huck",title:"Adventures of Huckleberry Finn",author:"Mark Twain",file:"https://raw.githubusercontent.com/stanjarin/NoBoNoFo/main/books/huck.json",legacy:true},{id:"dp",title:"Men I’m Not Married To",author:"Dorothy Parker",file:"PRIMED/DP_GUTS_PRIME2.json"},{id:"dr",title:"On Broadway",author:"Damon Runyon",file:"PRIMED/DR_GUTS_PRIME2.json"},{id:"ac",title:"The Murder at the Vicarage",author:"Agatha Christie",file:"PRIMED/AC_GUTS_PRIME2.json"},{id:"jj",title:"Ulysses",author:"James Joyce",file:"PRIMED/JJ_GUTS_PRIME2.json"},{id:"jt",title:"My Life and Hard Times",author:"James Thurber",file:"PRIMED/JT_GUTS_PRIME2.json"}];const DISPLAY=["jt","jeeves","farewell","aam","huck","dp","dr","ac","jj"];const BIG_COVERS={jt:"THURBER.jpg",jeeves:"JEEVES.jpg",farewell:"HEMINGWAY.jpg",aam:"POOH.jpg",huck:"HUCK.jpg",dp:"PARKER.jpg",dr:"RUNYON.jpg",ac:"CHRISTIE.jpg",jj:"JOYCE.jpg"};let state={screen:"gateway",book:null,ci:0,pi:0,homeScroll:0,contentsScroll:0};const cache=new Map(),KEY="guts-magic-v01",REMOTE_KEY="guts-remote-revision-v01";let magic=Object.assign({phase:"READY",force:"",paid:null,dwell:null,selectedChapter:null},JSON.parse(sessionStorage.getItem(KEY)||"{}"));const save=()=>sessionStorage.setItem(KEY,JSON.stringify(magic));
function applyRemoteState(r){if(!r||!["READY","ARMED","CLEAN"].includes(r.phase))return false;const rev=Number(r.revision||0),seen=Number(sessionStorage.getItem(REMOTE_KEY)||0);if(rev<=seen)return false;if(r.phase==="ARMED"&&String(r.word||"").trim()){if(magic.phase!=="PAID")magic={phase:"ARMED",force:String(r.word).trim(),paid:null,dwell:null,selectedChapter:null}}else if(r.phase==="CLEAN")magic={phase:"CLEAN",force:"",paid:null,dwell:null,selectedChapter:null};else if(r.phase==="READY"&&(magic.phase==="READY"||magic.phase==="CLEAN"))magic={phase:"READY",force:"",paid:null,dwell:null,selectedChapter:null};sessionStorage.setItem(REMOTE_KEY,String(rev));save();return true}async function pullRemoteState(){try{const r=await fetch('/api/state',{cache:'no-store'});if(r.ok)return applyRemoteState(await r.json())}catch(e){}return false}const esc=s=>String(s).replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'\"':"&quot;"}[c]));function tocTitle(c,i){let t=String(c.title||'').trim();const ps=c.pages&&c.pages[0]&&c.pages[0].paragraphs||[];if(/^COLLECTION\b/i.test(t))t=t.replace(/^COLLECTION\s*[—-]\s*/i,'').replace(/^(MORE THAN SOMEWHAT|FURTHERMORE)\s+/i,'');if(/^CHAPTER\b/i.test(t)&&ps[1]&&ps[1].length<90&&ps[1]===ps[1].toUpperCase())t=t+' — '+ps[1].replace(/^THE\s+/,'The ');if(t==='Book'){if(state.book&&state.book.id==='dp')return 'The Men I’m Not Married To';if(ps[0]&&ps[0].length<90)return ps[0];return 'Opening';}return t||('Chapter '+(i+1))}function meta(id){return META.find(x=>x.id===id)}
async function load(id){if(cache.has(id))return cache.get(id);const m=meta(id),raw=await(await fetch(m.file,{cache:'no-store'})).json();let b;if(m.legacy)b={id:m.id,title:m.title,author:m.author,chapters:raw.chapters};else{const groups=[];let current={title:'Book',pages:[]};raw.pages.forEach(p=>{const ch=p.paragraphs.find(x=>/^CHAPTER\b|^COLLECTION\b|^(TELEMACHUS|NESTOR|PROTEUS|CALYPSO|LOTUS|HADES|AEOLUS|LESTRYGONIANS|SCYLLA|WANDERING|SIRENS|CYCLOPS|NAUSICAA|OXEN|CIRCE|EUMAEUS|ITHACA|PENELOPE)/i.test(x));if(ch&&current.pages.length){groups.push(current);current={title:ch,pages:[]}}current.pages.push({paragraphs:p.paragraphs,force_paragraphs:p.force_paragraphs})});if(current.pages.length)groups.push(current);b={id:m.id,title:m.title,author:m.author,chapters:groups}}cache.set(id,b);return b}function key(){return state.book?state.book.id+':'+state.ci+':'+state.pi:''}function current(){return state.book.chapters[state.ci].pages[state.pi]}function inject(s){return magic.force?String(s).split('$$').join(magic.force):s}function visible(p){const k=key(),protectedOpener=state.pi===0&&magic.selectedChapter&&magic.selectedChapter.book===state.book.id&&magic.selectedChapter.ci===state.ci,forceHere=!protectedOpener&&(magic.phase==='ARMED'||(magic.phase==='PAID'&&magic.paid===k));return(forceHere&&p.force_paragraphs?p.force_paragraphs:p.paragraphs).map(x=>forceHere?inject(x):x)}function dwell(){clearTimeout(magic._timer);if(magic.phase!=='ARMED')return;const p=current(),k=key(),prot=state.pi===0&&magic.selectedChapter&&magic.selectedChapter.book===state.book.id&&magic.selectedChapter.ci===state.ci;if(!p.force_paragraphs||prot)return;magic.dwell={key:k,qualified:false};magic._timer=setTimeout(()=>{if(magic.phase==='ARMED'&&key()===k&&magic.dwell?.key===k){magic.dwell.qualified=true;save()}},6000)}function depart(){const k=key();if(magic.phase==='ARMED'&&magic.dwell?.qualified&&magic.dwell.key===k){magic.phase='PAID';magic.paid=k;magic.dwell=null;save()}}
function motion(change,dir=1,after){const a=document.getElementById('app'),old=a.firstElementChild;if(!old){change();render();if(after)after();return}old.classList.add(dir>0?'slideoutL':'slideoutR');setTimeout(()=>{change();render();const fresh=a.firstElementChild;if(fresh)fresh.classList.add(dir>0?'slideinR':'slideinL');if(after)after()},220)}function home(){state.screen='home';state.book=null;state.ci=0;state.pi=0;render();requestAnimationFrame(()=>scrollTo(0,state.homeScroll||0))}function gatewayChoice(){state.screen='home';state.homeScroll=0;render();scrollTo(0,0)}async function openBook(id){state.homeScroll=scrollY;state.book=await load(id);state.screen='cover';state.ci=0;state.pi=0;render();scrollTo(0,0)}function openContents(){motion(()=>{state.screen='contents';state.contentsScroll=0},1)}function openChapter(i){state.contentsScroll=scrollY;motion(()=>{state.ci=i;state.pi=0;if(magic.phase==='ARMED')magic.selectedChapter={book:state.book.id,ci:i};save();state.screen='reader'},1,dwell)}function backToContents(){motion(()=>state.screen='contents',-1,()=>requestAnimationFrame(()=>scrollTo(0,state.contentsScroll||0)))}function advance(d){depart();let n=state.pi+d;if(n<0){if(state.ci>0){state.ci--;state.pi=state.book.chapters[state.ci].pages.length-1}}else if(n>=state.book.chapters[state.ci].pages.length){if(state.ci<state.book.chapters.length-1){state.ci++;state.pi=0}}else state.pi=n}function turn(d){motion(()=>advance(d),d,dwell)}
let drag=null;function bindSwipe(){const r=document.querySelector('.reader'),p=document.querySelector('.page');if(!r||!p)return;r.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;const t=e.touches[0];drag={x:t.clientX,y:t.clientY,lastX:t.clientX,lastT:performance.now(),vx:0,horizontal:null};p.style.transition='none'},{passive:true});r.addEventListener('touchmove',e=>{if(!drag||e.touches.length!==1)return;const t=e.touches[0],dx=t.clientX-drag.x,dy=t.clientY-drag.y,now=performance.now();if(drag.horizontal===null&&Math.max(Math.abs(dx),Math.abs(dy))>8)drag.horizontal=Math.abs(dx)>Math.abs(dy)*1.15;if(!drag.horizontal)return;e.preventDefault();const dt=Math.max(1,now-drag.lastT);drag.vx=(t.clientX-drag.lastX)/dt;drag.lastX=t.clientX;drag.lastT=now;p.style.transform=`translate3d(${dx}px,0,0)`},{passive:false});r.addEventListener('touchend',e=>{if(!drag)return;const dx=(e.changedTouches[0]?.clientX||drag.lastX)-drag.x,w=r.clientWidth,go=drag.horizontal&&(Math.abs(dx)>w*.22||Math.abs(drag.vx)>.45);if(go){const d=dx<0?1:-1;p.style.transition='transform .16s ease-out';p.style.transform=`translate3d(${dx<0?-w:w}px,0,0)`;setTimeout(()=>{advance(d);render();const np=document.querySelector('.page');if(np){np.style.transform=`translate3d(${d>0?w:-w}px,0,0)`;np.style.transition='none';requestAnimationFrame(()=>requestAnimationFrame(()=>{np.style.transition='transform .18s ease-out';np.style.transform='translate3d(0,0,0)'}))}dwell()},160)}else{p.style.transition='transform .18s ease-out';p.style.transform='translate3d(0,0,0)'}drag=null},{passive:true})}
function render(){const a=document.getElementById('app');if(state.screen==='gateway'){a.innerHTML='<div class="artpage gateway-art"><img class="base" src="Pre-Page.jpg"><button class="hot h1" onclick="gatewayChoice()"></button><button class="hot h2" onclick="gatewayChoice()"></button><button class="hot h3" onclick="gatewayChoice()"></button><button class="hot h4" onclick="gatewayChoice()"></button></div>';return}if(state.screen==='home'){a.innerHTML='<div class="artpage landing-art"><img class="base" src="LANDING%20PAGE.jpg"><div class="carousel-window"><div class="carousel-track"><img src="Carousel.jpg"><div class="carousel-links">'+DISPLAY.map(id=>'<button onclick="openBook(\''+id+'\')"></button>').join('')+'</div></div></div><div class="carousel-mask"></div><img class="suggestions-overlay" src="Suggestions.png"><span class="buildstamp">0.33</span></div>';return}if(state.screen==='cover'){a.innerHTML='<div class="coverstage"><button class="coverback" onclick="home()">‹</button><img src="'+BIG_COVERS[state.book.id]+'" onclick="openContents()"></div>';return}if(state.screen==='contents'){a.innerHTML='<div class="contents-wrap"><div class="top"><button onclick="home()">‹</button><b>'+esc(state.book.title)+'</b></div><div class="contents"><h1>Contents</h1>'+state.book.chapters.map((c,i)=>'<button class="chapter" onclick="openChapter('+i+')">'+esc(tocTitle(c,i))+'</button>').join('')+'</div></div>';return}const paras=visible(current());a.innerHTML='<div class="reader-wrap"><div class="top"><button onclick="backToContents()">☰</button><b>'+esc(state.book.title)+'</b></div><div class="reader"><div class="page">'+paras.map(x=>'<p>'+esc(x)+'</p>').join('')+'</div><div class="hit left" onclick="turn(-1)"></div><div class="hit right" onclick="turn(1)"></div><div class="pageno">'+(state.pi+1)+'</div></div></div>';bindSwipe()}pullRemoteState().finally(render);setInterval(pullRemoteState,2500);</script></body></html>
