<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>Notes</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f6f8;color:#202124;font-family:Helvetica,Arial,sans-serif}.app{max-width:650px;margin:auto;min-height:100dvh;background:#fff}.bar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #e8e8e8;color:#bf8d05}.bar strong{color:#242424;font-size:21px}.bar button{background:none;border:0;color:#bf8d05;font:17px Helvetica,Arial;cursor:pointer}.screen{padding:18px 22px}.row{padding:18px 5px;border-bottom:1px solid #e8e8e8;display:flex;align-items:center;gap:15px;cursor:pointer}.row .thumb{width:48px;height:48px;object-fit:contain;background:#fff;border:1px solid #eee;border-radius:5px}.row .title{font-size:17px;font-weight:600}.row .sub{font-size:13px;color:#888;margin-top:5px}.editor{min-height:62vh;background:#fff;text-align:center;padding:10px 22px}.date{font-size:13px;color:#999;margin:16px 0 32px}.art{width:min(100%,473px);height:auto;max-height:55vh;object-fit:contain}.status{color:#999;text-align:center;font-size:13px;padding:12px}.fallback{display:flex;justify-content:center;padding:12px}.fallback button{font:15px Helvetica;background:#f4f4f4;border:1px solid #ddd;border-radius:9px;padding:10px 16px}.hidden{display:none!important}.cue{animation:cue .75s ease-in-out}@keyframes cue{0%{background:#fff}40%{background:#303030}100%{background:#fff}}.hint{font-size:12px;color:#aaa;padding:12px 24px;text-align:center}
</style></head><body><div class="app" id="app"><header class="bar"><button id="back">‹ Notes</button><strong id="heading">Notes</strong><button id="newTop" aria-label="New Note">▢✎</button></header><section id="list" class="screen"><h1 style="font-size:31px;margin:12px 0 16px">Notes</h1><div id="entries"></div><div class="row" id="newRow"><span style="color:#bf8d05;font-size:25px">＋</span><div class="title">New Note</div></div><div style="margin-top:36px;text-align:center;font:11px Helvetica,Arial,sans-serif;color:#c4c4c4">TRACE v0.2.1</div></section><section id="editor" class="hidden"><div class="editor" id="paper"><div class="date" id="date">New Note</div><img id="art" class="art hidden" alt=""><div class="status" id="status">Listening…</div></div><div class="fallback"><button id="retry">Listen again</button></div></section></div><script>

,"gambia":"flags/GAMBIA.jpg","georgia":"flags/GEORGIA.jpg","germany":"flags/GERMANY.jpg","ghana":"flags/GHANA.jpg","greecw":"flags/GREECW.jpg","greenland":"flags/GREENLAND.jpg","grenada":"flags/GRENADA.jpg","guatemala":"flags/GUATEMALA.jpg","guinea bissau":"flags/GUINEA-BISSAU.jpg","guinea":"flags/GUINEA.jpg","guyana":"flags/GUYANA.jpg","haiti":"flags/HAITI.jpg","honduras":"flags/HONDURAS.jpg","hong kong":"flags/HONG KONG.jpg","hungary":"flags/HUNGARY.jpg","iceland":"flags/ICELAND.jpg","india":"flags/INDIA.jpg","indonesia":"flags/INDONESIA.jpg","iran":"flags/IRAN.jpg","iraq":"flags/IRAQ.jpg","ireland":"flags/IRELAND.jpg","israel":"flags/ISRAEL.jpg","italy":"flags/ITALY.jpg","ivory coast":"flags/IVORY COAST.jpg","jamaica":"flags/JAMAICA.jpg","japan":"flags/JAPAN.jpg","jordan":"flags/JORDAN.jpg","kazakhstan":"flags/KAZAKHSTAN.jpg","kenya":"flags/KENYA.jpg","kiribati":"flags/KIRIBATI.jpg","kosovo":"flags/KOSOVO.jpg","kuwait":"flags/KUWAIT.jpg","kyrgyzstan":"flags/KYRGYZSTAN.jpg","laos":"flags/LAOS.jpg","latvia":"flags/LATVIA.jpg","lebanon":"flags/LEBANON.jpg","lesotho":"flags/LESOTHO.jpg","liberia":"flags/LIBERIA.jpg","libya":"flags/LIBYA.jpg","liechtenstein":"flags/LIECHTENSTEIN.jpg","lithuania":"flags/LITHUANIA.jpg","luxembourg":"flags/LUXEMBOURG.jpg","macau":"flags/MACAU.jpg","macedonia":"flags/MACEDONIA.jpg","madagascar":"flags/MADAGASCAR.jpg","malawi":"flags/MALAWI.jpg","malaysia":"flags/MALAYSIA.jpg","maldives":"flags/MALDIVES.jpg","mali":"flags/MALI.jpg","malta":"flags/MALTA.jpg","marshall islands":"flags/MARSHALL ISLANDS.jpg","mauritius":"flags/MAURITIUS.jpg","mauritania":"flags/MAURITANIA.jpg","mexico":"flags/MEXICO.jpg","micronesia":"flags/MICRONESIA.jpg","moldova":"flags/MOLDOVA.jpg","monaco":"flags/MONACO.jpg","mongolia":"flags/MONGOLIA.jpg","montenegro":"flags/MONTENEGRO.jpg","morocco":"flags/MOROCCO.jpg","mozambique":"flags/MOZAMBIQUE.jpg","myanmar":"flags/MYANMAR.jpg","namibia":"flags/NAMIBIA.jpg","nauru":"flags/NAURU.jpg","nepal":"flags/NEPAL.jpg","netherlands":"flags/NETHERLANDS.jpg","new zwaland":"flags/NEW ZWALAND.jpg","nicaragua":"flags/NICARAGUA.jpg","niger":"flags/NIGER.jpg","nigeria":"flags/NIGERIA.jpg","north korea":"flags/NORTH KOREA.jpg","norway":"flags/NORWAY.jpg","oman":"flags/OMAN.jpg","pakistan":"flags/PAKISTAN.jpg","palau":"flags/PALAU.jpg","palestine":"flags/PALESTINE.jpg","papua new guinea":"flags/PAPUA NEW GUINEA.jpg","paraguy":"flags/PARAGUY.jpg","peru":"flags/PERU.jpg","phillippines":"flags/PHILLIPPINES.jpg","poland":"flags/POLAND.jpg","portugal":"flags/PORTUGAL.jpg","puerto rico":"flags/PUERTO RICO.jpg","qatar":"flags/QATAR.jpg","republic of china":"flags/REPUBLIC OF CHINA.jpg","romania":"flags/ROMANIA.jpg","russia":"flags/RUSSIA.jpg","rwanda":"flags/RWANDA.jpg","saint kitts":"flags/SAINT KITTS.jpg","saint lucia":"flags/SAINT LUCIA.jpg","saint vincent":"flags/SAINT VINCENT.jpg","samoa":"flags/SAMOA.jpg","san marino":"flags/SAN MARINO.jpg","sao tome":"flags/SAO TOME.jpg","saudi arabia":"flags/SAUDI ARABIA.jpg","senegal":"flags/SENEGAL.jpg","serbia":"flags/SERBIA.jpg","seychelles":"flags/SEYCHELLES.jpg","sierra leone":"flags/SIERRA LEONE.jpg","singapore":"flags/SINGAPORE.jpg","slovakia":"flags/SLOVAKIA.jpg","slovenia":"flags/SLOVENIA.jpg","solomon islands":"flags/SOLOMON ISLANDS.jpg","somalia":"flags/SOMALIA.jpg","south africa":"flags/SOUTH AFRICA.jpg","south korea":"flags/SOUTH KOREA.jpg","south sudan":"flags/SOUTH SUDAN.jpg","spain":"flags/SPAIN.jpg","sri lanka":"flags/SRI LANKA.jpg","sudan":"flags/SUDAN.jpg","suriname":"flags/SURINAME.jpg","swaziland":"flags/SWAZILAND.jpg","sweden":"flags/SWEDEN.jpg","switzerland":"flags/SWITZERLAND.jpg","syria":"flags/SYRIA.jpg","tajikistan":"flags/TAJIKISTAN.jpg","tanzania":"flags/TANZANIA.jpg","thailand":"flags/THAILAND.jpg","togo":"flags/TOGO.jpg","tonga":"flags/TONGA.jpg","trinidad":"flags/TRINIDAD.jpg","tunisia":"flags/TUNISIA.jpg","turkey":"flags/TURKEY.jpg","turkmenistan":"flags/TURKMENISTAN.jpg","tuvalu":"flags/TUVALU.jpg","uganda":"flags/UGANDA.jpg","ukraine":"flags/UKRAINE.jpg","united arab emirates":"flags/UNITED ARAB EMIRATES.jpg","united kingdom":"flags/UNITED KINGDOM.jpg","united states":"flags/UNITED STATES.jpg","uruguay":"flags/URUGUAY.jpg","uzbekistan":"flags/UZBEKISTAN.jpg","vatican":"flags/VATICAN.jpg","venezuela":"flags/VENEZUELA.jpg","vietnam":"flags/VIETNAM.jpg","yemen":"flags/YEMEN.jpg","zambia":"flags/ZAMBIA.jpg","zimbabwe":"flags/ZIMBABWE.jpg"};const $=id=>document.getElementById(id);const R=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,notes=[],listening=false,active=null;
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim();
const aliases={'usa':'united states','america':'united states','uk':'united kingdom','uae':'united arab emirates','andorra':'andorra','vietnam':'vietnam'};
function matchCountry(phrases){for(const phrase of phrases){const p=' '+norm(phrase)+' ';for(const [a,b] of Object.entries(aliases)){if(p.includes(' '+a+' ')&&FLAGS[b])return b;}const keys=Object.keys(FLAGS).sort((a,b)=>b.length-a.length);for(const k of keys)if(p.includes(' '+k+' '))return k;}return null;}
function showList(){if(listening&&rec){try{rec.stop()}catch(e){}}$('editor').classList.add('hidden');$('list').classList.remove('hidden');$('heading').textContent='Notes';$('back').style.visibility='hidden';const entries=$('entries');entries.innerHTML='';for(const n of notes){const row=document.createElement('div');row.className='row';const im=document.createElement('img');im.className='thumb';im.src=FLAGS[n.country];row.append(im);const div=document.createElement('div');const title=document.createElement('div');title.className='title';title.textContent=n.country.replace(/\b\w/g,c=>c.toUpperCase());const sub=document.createElement('div');sub.className='sub';sub.textContent=n.date.toLocaleString('en-AU',{dateStyle:'medium',timeStyle:'short'});div.append(title,sub);row.append(div);row.onclick=()=>openExisting(n);entries.append(row);}}
function showEditor(){ $('list').classList.add('hidden');$('editor').classList.remove('hidden');$('heading').textContent='New Note';$('back').style.visibility='visible';}
function newNote(){active=null;showEditor();$('date').textContent='New Note';$('art').classList.add('hidden');$('status').textContent='Starting microphone…';listen();}
function openExisting(n){active=n;showEditor();$('date').textContent=n.date.toLocaleString('en-AU',{dateStyle:'medium',timeStyle:'short'});$('art').src=FLAGS[n.country];$('art').classList.remove('hidden');$('status').textContent='';}
function listen(){if(!R){$('status').textContent='Speech recognition unavailable in this browser';return;}if(listening){$('status').textContent='Already listening';return;}rec=new R();rec.lang='en-AU';rec.interimResults=false;rec.continuous=false;rec.maxAlternatives=5;rec.onstart=()=>{listening=true;$('status').textContent='Listening…';};rec.onresult=e=>{const phrases=Array.from(e.results[0]).map(x=>x.transcript);const country=matchCountry(phrases);if(!country){$('status').textContent='Not recognised: '+phrases[0];return;}const n={country,date:new Date()};notes.unshift(n);active=n;$('art').onload=()=>{$('paper').classList.remove('cue');void $('paper').offsetWidth;$('paper').classList.add('cue');};$('art').src=FLAGS[country];$('art').classList.remove('hidden');$('date').textContent=n.date.toLocaleString('en-AU',{dateStyle:'medium',timeStyle:'short'});$('status').textContent='';};rec.onerror=e=>{$('status').textContent='Recognition: '+e.error;};rec.onend=()=>{listening=false;if($('status').textContent==='Listening…')$('status').textContent='No speech heard';};try{rec.start()}catch(e){$('status').textContent=e.message;}}
$('newRow').onclick=newNote;$('newTop').onclick=newNote;$('back').onclick=showList;$('retry').onclick=listen;showList();
</script></body></html>
